/* ============================================================
   CAMERE preimpostate (elevazione E dal piano orizzontale)
   ============================================================ */
function camera(gradiE){ const e=gradiE*Math.PI/180;
  return {ce:Math.cos(e), se:Math.sin(e)}; }
/* =====================================================================
   L'ELEVAZIONE DELLA CAMERA IN PIANTA: 50 -> 42 GRADI, ed e' la riga
   che da sola raddrizza le figure. Non e' gusto, e' un conto.

   La proiezione e' SY = cy - (y·ce + zw·se)·s con s = hPx/(1,9·ce).
   La QUOTA contribuisce y·ce·s = y·hPx/1,9 — INDIPENDENTE
   dall'elevazione, perche' la s la normalizza. La PROFONDITA' invece
   contribuisce z·se·s = z·(hPx/1,9)·tan E. A 50 gradi tan E = 1,19: la
   falcata in avanti pesa sullo schermo il 19% PIU' dell'altezza. Una
   coscia a 0,9 rad porta il piede a ~0,35 m avanti, cioe' ~8,8 unita'
   di allungamento verticale su una figura alta 40 — un quarto del corpo
   speso a distendere gli arti lungo il terreno. Ecco perche' una corsa
   leggeva come una caduta e un fermo come un granchio: «marionette
   cadute» era la descrizione esatta di un fatto geometrico.

   A 42 gradi tan E = 0,900: lo splay cala del 24%, e NON SI SPOSTA DI
   UN PIXEL la quota verticale dei giunti — verificato a calcolo, y·ce·s
   non dipende da E. L'unico effetto collaterale e' la scala orizzontale
   s, che cala del 13,5% (27,84 -> 24,08): si compensa allargando dello
   stesso fattore le misure TRASVERSALI (HEADR, larghezze dei SEGS), e
   la figura resta larga uguale a schermo.
   La camera 'bassa' non si tocca: e' quella dei rigori e della ripresa
   del gol, dove la profondita' DEVE pesare.
   ===================================================================== */
const CAMERE={
  alto:  camera(42),   // la partita: top-down leggermente inclinata
  bassa: camera(16),   // i rigori / la ripresa del gol: dietro il giocatore
};

/* ============================================================
   SEGMENTI da disegnare (capsule) + ordinamento per profondita'
   kind: 0 capsula, 1 tronco (con disegno maglia), 2 testa
   bias: spinge avanti/indietro nei pareggi di profondita'
   ============================================================ */
/* ARTI CON MASSA (appelli 2026-08): a 40px di figura le vecchie larghezze
   (braccio 0.100, avambraccio 0.075, coscia 0.150, polpaccio 0.110)
   leggevano come FILI, non capsule — accanto alla pedina di Soccer Stars
   l'omino sembrava a tratto sottile. Su del 50-80%: braccio 0.16,
   avambraccio 0.13, coscia 0.24, polpaccio 0.175, piede 0.14; la barra
   dei fianchi sale a 0.24 per non lasciare le cosce piu' larghe del
   bacino. Il contorno unico resta e assorbe la massa nuova.
   riv:1 sui polpacci = CALZETTONE CON RISVOLTO: sopra la calza in tinta
   squadra si stampa un tratto corto al ginocchio in seconda tinta
   (look.risvolto) — e' il terzo blocco di colore delle pedine vere. */
/* LA SILHOUETTE A TRE MASSE, e le due strozzature che la fanno leggere.
   Riempita di nero puro la figura deve dare TESTA, BUSTO, GAMBE come tre
   masse distinte. Non lo era: la testa (4,3 unita' di raggio) si
   attaccava a un busto largo 7,5 tramite un collo largo 2,8 — in nero un
   ovale unico. Le larghezze qui sotto sono tutte moltiplicate per 1,156
   (la compensazione del calo d'elevazione: restano identiche a schermo)
   TRANNE due, che sono la manovra vera:
     - il COLLO scende a 0,085 invece di salire a 0,116: a schermo passa
       da 2,8 a 2,05 unita', una strozzatura del 27% fra testa e busto.
       E' quanto basta perche' la scansione orizzontale della sagoma
       abbia un minimo locale netto al collo — l'indizio che dice «e' un
       uomo». Resta sopra il minimo strutturale di 1,1 px;
     - la BARRA DEI FIANCHI resta 0,24 mentre il busto sale a 0,312: il
       bacino si strozza rispetto al torace, ed e' il secondo minimo
       locale. A schermo la barra cala del 13,5%, il busto no. */
const SEGS=[
  {a:PELVIS,b:NECK, w:0.312,c:'maglia',       bias:-0.012, kind:1},
  /* la BARRA DEI FIANCHI passa da 0,24 a 0,30. E' l'altra meta' della
     strozzatura in vita: un minimo locale esiste solo se sotto di lui
     risale una massa, e il bacino era largo 12,5 unita' contro le 15,7
     della vita — cioe' scendeva invece di risalire. A 0,30 il bacino
     legge 13,9 e la scansione ha finalmente una V. */
  {a:HIPL,  b:HIPR, w:0.30, c:'pantaloncini', bias:-0.006, kind:0},
  {a:NECK,  b:HEAD, w:0.085,c:'pelle',        bias:-0.002, kind:0},  // il COLLO: la strozzatura fra le due masse alte
  {a:HEAD,  b:HEAD, w:0,    c:'pelle',        bias: 0.010, kind:2},
  /* arti:1 = lo SPESSORE segue la corporatura (MSP). Solo gli arti: il
     busto, il collo, la barra dei fianchi e la testa restano larghi
     uguali per tutti — il busto perche' e' la finestra della sonda del
     contrasto, gli altri tre perche' sono le strozzature che fanno
     leggere le tre masse, e una strozzatura che cambia figura per
     figura non e' piu' un indizio, e' rumore. */
  /* pi:1 = ESTREMO PIATTO SOTTO SOGLIA, la stessa manovra del busto e per
     la stessa ragione. La calotta tonda del braccio sporge oltre la spalla
     di mezza larghezza (0,133 m con il contorno), cioe' ARRIVA 0,11 m PIU'
     IN ALTO del giunto del collo: in maschera nera la massa delle spalle
     saliva a saldarsi con il cranio e il minimo locale del collo — la
     prima delle due strozzature che fanno leggere «e' un uomo» — non
     esisteva in nessuna posa in piedi (misurato: masse 0 su 9 sagome su
     10). Con l'estremo piatto la spalla finisce dove finisce l'osso, sotto
     il mento, e il profilo delle scansioni scende alla larghezza del collo
     prima di risalire a quella delle spalle. Il gomito non si scopre: la
     capsula dell'avambraccio ha la sua calotta tonda e parte da li'.
     Da vicino (lodOn) niente: a cento pixel il taglio si vedrebbe. */
  {a:SHR,b:ELR, w:0.162,c:'maglia', bias:0.005, kind:0, arti:1, pi:1},
  {a:ELR,b:HAR, w:0.130,c:'pelle',  bias:0.008, kind:0, arti:1},
  {a:SHL,b:ELL, w:0.162,c:'maglia', bias:0.005, kind:0, arti:1, pi:1},
  {a:ELL,b:HAL, w:0.130,c:'pelle',  bias:0.008, kind:0, arti:1},
  {a:HIPR,b:KNR, w:0.240,c:'pantaloncini', bias:0.002, kind:0, arti:1, cos:1},
  {a:KNR, b:FTR, w:0.176,c:'calze',        bias:0.004, kind:0, riv:1, arti:1},
  {a:FTR, b:TOR, w:0.150,c:'scarpe',       bias:0.006, kind:0, arti:1},
  {a:HIPL,b:KNL, w:0.240,c:'pantaloncini', bias:0.002, kind:0, arti:1, cos:1},
  {a:KNL, b:FTL, w:0.176,c:'calze',        bias:0.004, kind:0, riv:1, arti:1},
  {a:FTL, b:TOL, w:0.150,c:'scarpe',       bias:0.006, kind:0, arti:1},
  {a:PELVIS,b:PELVIS, w:0, c:'palla', bias:0, kind:3},  // palla (solo clip col pallone)
];
const NS=SEGS.length;
const DEPTH=new Float32Array(NS);
const ORD=new Int32Array(NS); for(let i=0;i<NS;i++)ORD[i]=i;

/* il contorno UNICO della figura: lo stesso scuro caldo del bordo della
   palla, cosi' la sagoma legge come un corpo solo (vedi il passaggio di
   sottofondo in disegna) e non tredici rettangoli bordati uno a uno */
const BORDO='#23201a';
/* la tinta del FILO DI STACCO fra due corpi: la stessa luce fredda con cui
   il gioco stacca gia' la palla e i solchi dall'erba, non una quinta tinta */
const STACCO_FILO='#e7f0da';

/* =====================================================================
   IL BUSTO E' UN TRAPEZIO: PETTO LARGO, VITA STRETTA.
   La capsula a larghezza costante dava un profilo che dal collo ai piedi
   non aveva un solo minimo in mezzo: «tre masse» era una promessa senza
   la strozzatura che la mantiene, e in nero la figura leggeva come un
   orsacchiotto. Con la vita a 0,222 contro il petto a 0,345 la scansione
   orizzontale trova il SECONDO minimo locale (il primo e' il collo).
   La sonda del contrasto di collaudo.js campiona il busto attorno a
   t=0,74 del segmento pelvi-collo: li' il trapezio vale 0,313, cioe' la
   stessa larghezza della capsula di prima. Nessuna differenza dove si
   MISURA, tutta la differenza dove si GUARDA.
   f0..f1 e' la banda laterale (0 = filo ovest, 1 = filo est): con 0..1
   esce la sagoma intera, con le frazioni escono le due mezze capsule del
   terminatore, che cosi' seguono la rastrematura invece di sbordare.
   extra allarga per il contorno e allunga SOLO verso il basso: la cima
   resta piatta al collo, che e' la prima strozzatura. */
const W_PETTO=0.345, W_VITA=0.195;
function troncoQuad(ctx,s,extra,f0,f1,t0,t1){
  const ax=SX[PELVIS],ay=SY[PELVIS],dx=SX[NECK]-ax,dy=SY[NECK]-ay;
  const L=Math.sqrt(dx*dx+dy*dy); if(L<0.5) return;
  let nx=-dy/L, ny=dx/L; if(nx>0){nx=-nx;ny=-ny;}      // nx punta a ovest
  const wa=W_VITA*s*0.5+extra, wb=W_PETTO*s*0.5+extra;
  const ta=t0-extra/L;
  ctx.beginPath();
  for(let k=0;k<4;k++){
    const t=(k===0||k===3)?ta:t1, f=(k<2)?f0:f1;
    const w=wa+(wb-wa)*t, X=ax+dx*t, Y=ay+dy*t, o=w*(1-2*f);
    if(k) ctx.lineTo(X+nx*o,Y+ny*o); else ctx.moveTo(X+nx*o,Y+ny*o);
  }
  ctx.closePath(); ctx.fill();
}


/* ============================================================
   IL LIVELLO DI DETTAGLIO DA VICINO (15 ago 2026, 15 giudici su 26).
   La figura e' nata per 30px: ingrandita nel primo piano del gol e dai
   rigori mostrava testa senza volto, mani a bozzolo, maglia piatta e un
   contorno che cresceva con lo zoom. Oltre LOD_PX di altezza A SCHERMO
   (hPx x pxs, l'ultima cifra la passa il chiamante: la scala della sua
   trasformazione, o il DPR nelle scene gia' in pixel di schermo) il rig
   aggiunge: volto abbozzato (occhi, sopracciglia, accenno del naso),
   capelli con un taglio (look.taglio 0/1/2), mani a dita stilizzate,
   colletto e due toni di tessuto sulla maglia, suola e lampo sulle
   scarpe — e il contorno unico smette di crescere (~1px a schermo).
   SOTTO soglia non cambia NIENTE: il costo di ?rigcosto resta quello.
   lodOn/lodK sono stato di modulo azzerato a ogni disegna(): mai
   allocazioni, mai stato che sopravvive alla figura. */
const LOD_PX=120;
let lodOn=false, lodK=1;

/* MANI CON POLLICE E DITA RAGGRUPPATE (quinto appello). Il ventaglio a
   tre tratti aperti leggeva come una paletta: le dita di una mano vera
   stanno INSIEME. Qui due tratti quasi paralleli (il blocco delle dita,
   lunghezze diverse: la mano non e' simmetrica) piu' un POLLICE corto
   staccato di lato — il lato del corpo: destro per la mano destra, che
   e' l'ultimo giunto HAR. Con bordo>=0 disegna il passaggio di contorno
   (scuro, piu' largo), senno' la pelle. */
function mano(ctx,s,ja,jb,look,bordo){
  const ax=SX[ja],ay=SY[ja];
  let dx=SX[jb]-ax, dy=SY[jb]-ay;
  const L=Math.sqrt(dx*dx+dy*dy);
  if(L>1e-3){dx/=L;dy/=L;}else{dx=0;dy=1;}
  const px=-dy, py=dx, bx=SX[jb], by=SY[jb];
  const w=0.052*s<0.8?0.8:0.052*s;
  ctx.lineWidth = bordo>=0 ? w+2*bordo : w;
  ctx.strokeStyle = bordo>=0 ? BORDO : look.pelle;
  const th=(jb===HAR?1:-1);              // il pollice sta dal lato del corpo
  ctx.beginPath();
  /* il blocco delle dita: due tratti vicini, quasi paralleli */
  for(let f=0;f<2;f++){
    const o=(f?0.020:-0.020), ln=(f?0.128:0.150)*s;
    ctx.moveTo(bx+dx*0.015*s+px*o*s, by+dy*0.015*s+py*o*s);
    ctx.lineTo(bx+dx*ln+px*(o+(f?0.010:-0.006))*s, by+dy*ln+py*(o+(f?0.010:-0.006))*s);
  }
  /* il pollice accennato: corto, aperto di lato */
  ctx.moveTo(bx+dx*0.010*s, by+dy*0.010*s);
  ctx.lineTo(bx+dx*0.055*s+px*th*0.078*s, by+dy*0.055*s+py*th*0.078*s);
  ctx.stroke();
}

/* LUCE SUI CORPI: il bordo di luce da ovest che gia' modella la palla e i
   pannelli (il sole di TUTTO il gioco sta a ovest) va anche su busto e
   testa — un filo caldo sul lato ovest, un filo piu' scuro sul lato est.
   Le due tinte si PRE-CALCOLANO una volta per divisa (cache sull'oggetto
   look, chiave la tinta della maglia): zero costo per pixel, il fotogramma
   paga solo due tratti in piu' per figura. La camera guarda il campo da
   nord, quindi l'ovest del mondo e' la sinistra dello schermo e il filo
   non dipende dallo yaw: e' il sole a essere fermo, non il corpo. */
function mescolaTinta(hex,verso,f){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const R=parseInt(verso.slice(1,3),16), G=parseInt(verso.slice(3,5),16), B=parseInt(verso.slice(5,7),16);
  const m=v=>{const x=Math.round(v); return (x<16?'0':'')+x.toString(16);};
  return '#'+m(r+(R-r)*f)+m(g+(G-g)*f)+m(b+(B-b)*f);
}
/* LE DUE TINTE DELLA SERA, e perche' quella d'ombra e' cambiata.
   Prima il lato in ombra tirava a '#241d10', un bruno caldo: la figura
   veniva illuminata e ombreggiata con LA STESSA FAMIGLIA di colore, e il
   risultato non leggeva «sera», leggeva «sporco». Al sole radente il buio
   non lo riempie il nero e nemmeno il bruno: lo riempie IL CIELO, ed e'
   blu-violetto — la stessa legge gia' scritta per le ombre del campo.
   Mettere il caldo da una parte e il freddo dall'altra e' da solo il
   quaranta per cento dell'effetto «sera» sulle figure, e costa ZERO: le
   due tinte si calcolano una volta per divisa e restano in cache
   sull'oggetto look, mai dentro il fotogramma.
   La cache copre anche gli ARTI: calze, pantaloncini e pelle hanno la
   loro versione in ombra, cosi' il lato est di una gamba si sceglie con
   un confronto invece di aggiungere un tratto. */
function lumiLook(look){
  look._lume =mescolaTinta(look.maglia,'#ffe9b8',0.40);        // ambra, ovest
  look._ombra=mescolaTinta(look.maglia,SOLE.tintaOmbra,0.38);  // viola-blu, est
  look._ombS={
    maglia:       look._ombra,
    maglia2:      look.maglia2      ? mescolaTinta(look.maglia2,      SOLE.tintaOmbra,0.34) : null,
    calze:        look.calze        ? mescolaTinta(look.calze,        SOLE.tintaOmbra,0.34) : null,
    pantaloncini: look.pantaloncini ? mescolaTinta(look.pantaloncini, SOLE.tintaOmbra,0.34) : null,
    pelle:        look.pelle        ? mescolaTinta(look.pelle,        SOLE.tintaOmbra,0.30) : null,
  };
  return look;
}

/* disegno della maglia: strisce verticali o fascia orizzontale */
function motivo(ctx,s,look){
  const ax=SX[PELVIS],ay=SY[PELVIS],bx=SX[NECK],by=SY[NECK];
  const dx=bx-ax,dy=by-ay, L=Math.sqrt(dx*dx+dy*dy);
  if(L<1.5||look.disegno==='tinta')return;
  const nx=-dy/L, ny=dx/L;
  ctx.strokeStyle=look.maglia2;
  if(look.disegno==='strisce'){
    /* le strisce si misurano sul busto, che e' passato da 0,27 a 0,312:
       stesso rapporto di prima (0,607 della semilarghezza), cosi' le due
       righe restano fuori dalla colonna ±1,5 della sonda del contrasto */
    /* l'offset e' una FRAZIONE della semilarghezza locale (0,607), non un
       numero fisso: sul trapezio le due righe si stringono alla vita
       insieme al tessuto invece di uscirne */
    const oa=0.607*W_VITA*0.5*s, ob=0.607*W_PETTO*0.5*s, w=0.0717*s;
    const o0=oa+(ob-oa)*0.10, o1=oa+(ob-oa)*0.90;
    ctx.lineWidth=w<1?1:w;
    ctx.beginPath();
    ctx.moveTo(ax+dx*0.10+nx*o0, ay+dy*0.10+ny*o0);
    ctx.lineTo(ax+dx*0.90+nx*o1, ay+dy*0.90+ny*o1);
    ctx.moveTo(ax+dx*0.10-nx*o0, ay+dy*0.10-ny*o0);
    ctx.lineTo(ax+dx*0.90-nx*o1, ay+dy*0.90-ny*o1);
    ctx.stroke();
  }else if(look.disegno==='fascia'){
    /* LA FASCIA SALE E DIMAGRISCE (A0 dell'onda delle figure). Stava al
       60% del segmento pelvi-collo spessa 0,11·s: la banda della SECONDA
       tinta copriva da -11,87 a -15,48 unita' sopra il centro, cioe'
       occupava GIA' una delle tre file della sonda di collaudo.js
       (-12,5 / -11,5 / -10,5). Il cancello del contrasto reggeva solo
       perche' la mediana pesca 14 campioni su 21 sulla prima tinta: un
       margine di 0,37 unita', cioe' 0,017 m di geometria del rig.
       A 0,70 e 0,085·s la banda parte a -13,4 e nessuna fila la tocca.
       E' il margine COMPRATO prima di spendere qualunque cosa sul rig. */
    const w=0.085*s, h=0.1156*s;
    ctx.lineWidth=w<1?1:w;
    ctx.beginPath();
    ctx.moveTo(ax+dx*0.70-nx*h, ay+dy*0.70-ny*h);
    ctx.lineTo(ax+dx*0.70+nx*h, ay+dy*0.70+ny*h);
    ctx.stroke();
  }
}

/* testa: cerchio pelle + calotta capelli spostata via dalla faccia.
   Da dietro i capelli coprono tutto, di profilo meta', di fronte
   resta la mezzaluna del viso: e' questo che dice DOVE guarda. */
function testa(ctx,s,cyw,syw,cam,look){
  const r=HEADR*s, X=SX[HEAD], Y=SY[HEAD];
  ctx.fillStyle=look.pelle;
  ctx.beginPath(); ctx.arc(X,Y,r,0,TAU); ctx.fill();
  const fdx=syw, fdy=-cyw*cam.se;
  const L=Math.sqrt(fdx*fdx+fdy*fdy);
  const dot=-cyw*cam.ce;                 // >0 se la faccia punta alla camera
  let o=r*0.60*(dot+1)*0.5; if(o>0.5*r)o=0.5*r;
  let hx=X, hy=Y-r*0.10;
  if(L>1e-4){ hx=X-fdx/L*o; hy=Y-fdy/L*o-r*0.10; }
  /* IL TAGLIO SI VEDE ANCHE A 40 PX, ed e' il cambio: prima la forma dei
     capelli era dettaglio ravvicinato (`lodOn ? ... : 0`) e in pianta —
     cioe' in tutta la partita — le teste erano TUTTE la stessa calotta.
     Il raggio della calotta e' gia' disegnato: farlo dipendere dal taglio
     non costa un tratto in piu' e da' quattro teste distinguibili in
     sagoma, non solo in tinta. I dettagli veri (il ciuffo, i tre lobi
     del riccio, la fascetta) restano sotto lodOn, perche' sotto i 40 px
     sarebbero mezzo pixel di rumore.
     Nessuna calotta esce dal contorno della testa: la piu' larga e' il
     riccio a 1,00·r, alzata di 0,10·r, cioe' 1,10·r contro il perimetro
     scuro che sta a r+bd = 1,22·r. */
  const taglio = (look.taglio|0)%4;
  const rc = taglio===0 ? r*0.82 : taglio===2 ? r*1.00 : taglio===3 ? r*0.90 : r*0.94;
  ctx.fillStyle=look.capelli;
  ctx.beginPath(); ctx.arc(hx,hy,rc,0,TAU); ctx.fill();
  if(lodOn){
    if(taglio===1){                       // il CIUFFO in cima
      ctx.beginPath(); ctx.arc(hx,hy-r*0.70,r*0.32,0,TAU); ctx.fill();
    }else if(taglio===2){                 // il RICCIO: tre lobi sul bordo
      ctx.beginPath(); ctx.arc(hx-r*0.62,hy-r*0.46,r*0.30,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(hx+r*0.62,hy-r*0.46,r*0.30,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(hx,        hy-r*0.80,r*0.30,0,TAU); ctx.fill();
    }else if(taglio===3 && look.maglia2){ // la FASCETTA, in seconda tinta
      ctx.strokeStyle=look.maglia2;
      const lw=r*0.26; ctx.lineWidth=lw<1?1:lw;
      ctx.beginPath(); ctx.arc(hx,hy,rc*0.86,Math.PI*0.10,Math.PI*0.90); ctx.stroke();
    }
  }
  /* VOLTO ABBOZZATO, solo da vicino e solo se la faccia guarda la camera:
     due tratti per gli occhi, le sopracciglia nel colore dei capelli,
     l'accenno del naso. Tutto lungo l'asse (u) del viso proiettato, cosi'
     il volto segue lo yaw e sfuma a profilo come fa la mezzaluna. */
  if(lodOn && L>1e-4 && dot>0.10){
    const ux=fdx/L, uy=fdy/L, px2=-uy, py2=ux;
    const vis = dot>0.60 ? 1 : (dot-0.10)/0.50;
    /* gli occhi vivono NELLA mezzaluna del viso, non sotto la calotta:
       h0 e' dove la calotta finisce lungo l'asse del viso */
    const h0=0.94*r-o;
    let eyeD=(h0<0.30*r?0.30*r:h0)+0.15*r; if(eyeD>0.62*r)eyeD=0.62*r;
    const exC=X+ux*eyeD, eyC=Y+uy*eyeD;
    const eo=r*0.30;
    const lw=r*0.10<0.7?0.7:r*0.10;
    ctx.lineCap='round';
    /* OCCHI A MANDORLA PIENI (quinto appello): i due trattini spessi a
       capo tondo sbavavano in macchie sotto la frangia. Due ellissi
       schiacciate lungo l'asse trasversale del viso (px2): pulite a ogni
       zoom, e si stringono a profilo con la stessa proiezione del volto. */
    const eAng=Math.atan2(py2,px2);
    ctx.globalAlpha=0.95*vis;
    ctx.fillStyle='#2b2119';
    ctx.beginPath();
    ctx.ellipse(exC+px2*eo+ux*r*0.045, eyC+py2*eo+uy*r*0.045, r*0.125, r*0.058, eAng, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(exC-px2*eo+ux*r*0.045, eyC-py2*eo+uy*r*0.045, r*0.125, r*0.058, eAng, 0, TAU);
    ctx.fill();
    /* sopracciglia in scuro pieno, staccate dagli occhi: al filo della
       calotta devono leggersi sia sopra i capelli sia sopra la pelle */
    ctx.strokeStyle='#1c1410';
    ctx.lineWidth=lw*0.75;
    ctx.beginPath();
    ctx.moveTo(exC+px2*(eo+r*0.10)-ux*r*0.15, eyC+py2*(eo+r*0.10)-uy*r*0.15);
    ctx.lineTo(exC+px2*(eo-r*0.10)-ux*r*0.18, eyC+py2*(eo-r*0.10)-uy*r*0.18);
    ctx.moveTo(exC-px2*(eo+r*0.10)-ux*r*0.15, eyC-py2*(eo+r*0.10)-uy*r*0.15);
    ctx.lineTo(exC-px2*(eo-r*0.10)-ux*r*0.18, eyC-py2*(eo-r*0.10)-uy*r*0.18);
    ctx.stroke();
    ctx.globalAlpha=0.35*vis;
    ctx.strokeStyle='#5a3d28';
    ctx.lineWidth=lw*0.75;
    ctx.beginPath();
    ctx.moveTo(exC+ux*r*0.10, eyC+uy*r*0.10);
    ctx.lineTo(exC+ux*r*0.22+px2*r*0.03, eyC+uy*r*0.22+py2*r*0.03);
    ctx.stroke();
    ctx.globalAlpha=1;
  }
  /* il filo di luce da ovest anche sulla testa: due archi sottili dentro
     il cerchio. Sono VELI (alfa), non tinte: valgono sopra pelle e capelli
     insieme, qualunque sia la mezzaluna del viso. Con y in giu' l'angolo
     pi greco e' la sinistra dello schermo, cioe' l'ovest del mondo. */
  const t=r*0.30<0.8?0.8:r*0.30, rr=r-t*0.5;
  ctx.lineWidth=t;
  ctx.strokeStyle='rgba(255,233,184,.44)';
  ctx.beginPath(); ctx.arc(X,Y,rr,0.60*Math.PI,1.40*Math.PI); ctx.stroke();
  /* il lato est della testa prende la stessa tinta d'ombra di tutto il
     resto della figura — viola-blu del cielo, mai il bruno di prima:
     illuminare e ombreggiare con la stessa famiglia faceva «sporco» */
  ctx.strokeStyle='rgba(42,51,88,.34)';
  ctx.beginPath(); ctx.arc(X,Y,rr,-0.35*Math.PI,0.35*Math.PI); ctx.stroke();
}

/* palla: cerchio chiaro bordato scuro (leggibile anche a 2-3 px di raggio),
   con la macchia dell'esagono solo quando c'e' spazio; la schiacciata
   all'impatto e' la deformazione che vende il colpo. PRF e' la
   prospettiva della sola palla: lontana dalla camera RIMPICCIOLISCE
   (il tiro che parte), alta e vicina alla camera dall'alto INGRANDISCE
   (la palla sopra la rovesciata) */
function disegnaPalla(ctx,s,look){
  const r=RPALLA*s*PRF, sq=PALLA[3];
  const rx=r*(1+sq*0.7), ry=r*(1-sq);
  ctx.fillStyle=look.palla;
  ctx.beginPath(); ctx.ellipse(PSX,PSY,rx,ry,0,0,TAU); ctx.fill();
  ctx.strokeStyle='#23201a'; ctx.lineWidth=r*0.18<1?1:r*0.18; ctx.stroke();
  if(r>3.5){
    ctx.fillStyle='#23201a';
    ctx.beginPath(); ctx.arc(PSX-rx*0.16,PSY-ry*0.14,r*0.28,0,TAU); ctx.fill();
  }
}

/* ============================================================
   disegna(ctx, cx, cyTerra, hPx, yaw, nomeCamera, nomeClip, tSec, look)
   cx,cyTerra: punto a terra sotto la figura, in pixel.
   hPx: altezza apparente voluta della figura (30 in partita).
   ============================================================ */
function disegna(ctx,cx,cy,hPx,yaw,nomeCam,nomeClip,tSec,look,senzaOmbra,pxs,filo){
  const clip=CLIPS[nomeClip], cam=CAMERE[nomeCam];
  /* le tinte caldo/freddo della divisa: si calcolano UNA VOLTA per look e
     restano in cache. Qui in testa e non dentro il ciclo, perche' gli arti
     le leggono prima che il busto arrivi nell'ordine di profondita'. */
  if(look._lume===undefined) lumiLook(look);
  /* LOD da vicino: pxs = pixel di schermo per pixel di disegno (la scala
     della trasformazione del chiamante; 1 se non dichiarata). Oltre
     LOD_PX di figura A SCHERMO si accende il dettaglio, sotto niente. */
  lodK=pxs||1; lodOn=hPx*lodK>=LOD_PX;
  /* LA CORPORATURA SI SCEGLIE QUI, prima di ogni posa: le misure vive
     valgono per questa figura e per tutte le valutazioni che seguono
     (compresi i due fantasmi della scia). look.corp e look.varb
     arrivano dal SEME DEL NOME e stanno nella cache di rigLook, quindi
     non si calcolano nel fotogramma: qui si fanno solo sei prodotti, e
     solo quando la corporatura cambia davvero rispetto alla figura
     precedente. Senza dichiarazione si torna alla taglia nominale — e'
     il caso del banco, del duello e della ripresa del gol, dove la
     figura e' una sola e non c'e' nessuno da cui distinguerla. */
  corpora(look.corp===undefined?3:look.corp, look.varb||0);
  let u=(tSec*clip.freq)%1; if(u<0)u+=1;
  const cyw=Math.cos(yaw), syw=Math.sin(yaw);
  const ce=cam.ce<0.58?0.58:cam.ce;   // non gonfiare troppo le falcate in pianta
  const s=hPx/(1.9*ce);
  // arco di scia del giunto che frusta (rovesciata): le due posizioni
  // passate, valutate PRIMA della posa vera (P e' scratch riusato)
  let nsc=0;
  if(clip.scia && u>clip.scia.t0 && u<clip.scia.t1){
    for(let g=2;g>=1;g--){
      clip.pose(u-0.022*g);
      const j=clip.scia.j, x=P[j*3], y=P[j*3+1], z=P[j*3+2];
      const xw=x*cyw+z*syw, zw=z*cyw-x*syw;
      SCX[nsc]=cx+xw*s; SCY[nsc]=cy-(y*cam.ce+zw*cam.se)*s; nsc++;
    }
  }
  clip.pose(u);
  for(let j=0;j<NJ;j++){
    const x=P[j*3], y=P[j*3+1], z=P[j*3+2];
    const xw=x*cyw+z*syw, zw=z*cyw-x*syw;
    SX[j]=cx+xw*s;
    SY[j]=cy-(y*cam.ce+zw*cam.se)*s;
    SD[j]=zw*cam.ce-y*cam.se;
  }
  TORSO.x0=SX[PELVIS]; TORSO.y0=SY[PELVIS]; TORSO.x1=SX[NECK]; TORSO.y1=SY[NECK];
  // palla della clip (se prevista): stessa proiezione dei giunti
  let pallaQui=false, pxw=0,pzw=0,pby=0, nGh=0;
  if(clip.palla && look.palla!==null){   /* ADATTAMENTO (a): in pianta la palla e' quella VERA di drawBall */
    clip.palla(u,PALLA); pallaQui=true;
    let bx=PALLA[0]; pby=PALLA[1]; const bz=PALLA[2];
    // palla bassa vicino ai piedi: scarto laterale in funzione dello yaw,
    // verso la camera, cosi' a 225°/270° non finisce dentro la tibia
    let wq=(0.56-(pby-RPALLA))*2.2;
    if(wq>0){ if(wq>1)wq=1; bx+=0.085*syw*wq; }
    pxw=bx*cyw+bz*syw; pzw=bz*cyw-bx*syw;
    PSX=cx+pxw*s; PSY=cy-(pby*cam.ce+pzw*cam.se)*s;
    PSD=pzw*cam.ce-pby*cam.se;
    // prospettiva della sola palla: la profondita' camera la scala
    if(PSD>0){ PRF=1/(1+0.12*PSD); if(PRF<0.45)PRF=0.45; }
    else{ PRF=1-0.30*PSD; if(PRF>1.5)PRF=1.5; }
    // SCIA breve: 2 fantasmi quando la palla percorre tanto spazio per
    // unita' di tempo (il primo decimo del volo veloce: e' la scia che
    // vende la velocita' a 30px), niente quando rallenta
    for(let g=1;g<=2;g++){
      const ug=u-0.018*g; if(ug<0)break;
      clip.palla(ug,PALLB);
      const gx2=PALLA[0]-PALLB[0], gy2=PALLA[1]-PALLB[1], gz2=PALLA[2]-PALLB[2];
      if(gx2*gx2+gy2*gy2+gz2*gz2 < 0.10*g*g) break;   // ~0.32 m a passo
      const xw2=PALLB[0]*cyw+PALLB[2]*syw, zw2=PALLB[2]*cyw-PALLB[0]*syw;
      GHX[nGh]=cx+xw2*s; GHY[nGh]=cy-(PALLB[1]*cam.ce+zw2*cam.se)*s; nGh++;
    }
  }
  // ombra a terra (niente shadowBlur: una semplice ellisse); in volo
  // si STACCA: la quota del giunto piu' basso la rimpicciolisce e sbiadisce
  {
    const x=P[PELVIS*3], z=P[PELVIS*3+2];
    const xw=x*cyw+z*syw, zw=z*cyw-x*syw;
    let mn=P[1]; for(let j=1;j<NJ;j++){ const yy=P[j*3+1]; if(yy<mn)mn=yy; }
    let quota=mn-0.05; if(quota<0)quota=0;
    // il termine quadratico stacca NETTAMENTE l'ombra alle quote alte
    // (rovesciata, tuffo): e' l'indizio d'aria che la pianta capisce
    const fo=1/(1+2.6*quota+3.2*quota*quota);
    const gx=cx+xw*s, gy=cy-zw*cam.se*s;
    // l'alfa cala meno del raggio: l'ombra piccola resta VISIBILE anche
    // a 30px — e' il distacco che dice "in aria", non la sparizione
    if(!senzaOmbra){   /* ADATTAMENTO (b): in pianta l'ombra portata la fa drawOmbreGiocatori */
      ctx.globalAlpha=0.22*(0.40+0.60*fo); ctx.fillStyle='#000';
      ctx.beginPath();
      ctx.ellipse(gx, gy, 0.27*s*fo, (0.27*s*cam.se+0.5)*fo, 0,0,TAU);
      ctx.fill();
    }
    if(clip.polvere){                 // la polvere dell'impatto
      const pv=(u-clip.polvere.t)/clip.polvere.d;
      if(pv>0&&pv<1){
        if(clip.polvere.solchi){
          // frenata: i piedi ARANO — due segni brevi dietro i tacchi
          ctx.globalAlpha=0.50*(1-pv); ctx.strokeStyle='#cdd9b9';
          const lw=0.05*s; ctx.lineWidth=lw<1?1:lw;
          const lm=(0.14+0.10*pv)*s;
          for(let f2=0;f2<2;f2++){
            const j=f2?FTL:FTR, xj=P[j*3], zj=P[j*3+2];
            const xwf=xj*cyw+zj*syw, zwf=zj*cyw-xj*syw;
            const fx2=cx+xwf*s, fy2=cy-zwf*cam.se*s;
            ctx.beginPath(); ctx.moveTo(fx2,fy2);
            ctx.lineTo(fx2-syw*lm, fy2+cyw*cam.se*lm); ctx.stroke();
          }
        }else{
          ctx.globalAlpha=0.40*(1-pv); ctx.fillStyle='#cdd9b9';
          const r=(0.06+0.17*pv)*s, dx=(0.16+0.32*pv)*s, ry=(0.03+0.11*pv)*s*cam.ce;
          ctx.beginPath(); ctx.arc(gx-dx, gy-ry, r*0.8, 0, TAU); ctx.fill();
          ctx.beginPath(); ctx.arc(gx+dx*0.85, gy-ry*1.2, r, 0, TAU); ctx.fill();
          ctx.beginPath(); ctx.arc(gx+dx*0.15, gy-ry*1.7, r*0.6, 0, TAU); ctx.fill();
        }
      }
    }
    if(pallaQui){   // l'ombra della palla dice a che altezza vola
      const rp=RPALLA*s*0.9*(PRF<1?PRF:1);
      ctx.globalAlpha=0.20/(1+3*(pby-RPALLA)); ctx.fillStyle='#000';
      ctx.beginPath();
      ctx.ellipse(cx+pxw*s, cy-pzw*cam.se*s, rp, rp*cam.se+0.4, 0,0,TAU);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  if(nGh>0){        // la scia della palla: fantasmi sfumati dietro il volo
    ctx.fillStyle=look.palla;
    for(let g=0;g<nGh;g++){
      ctx.globalAlpha=g?0.11:0.22;
      const rg=RPALLA*s*PRF*(g?0.55:0.75);
      ctx.beginPath(); ctx.arc(GHX[g],GHY[g],rg,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  if(nsc>0){        // l'arco di scia dietro il piede che frusta
    const lw=0.09*s; ctx.lineWidth=lw<1?1:lw; ctx.strokeStyle='#eef4e6';
    ctx.globalAlpha=0.14;
    ctx.beginPath(); ctx.moveTo(SCX[0],SCY[0]); ctx.lineTo(SCX[1],SCY[1]); ctx.stroke();
    ctx.globalAlpha=0.26;
    ctx.beginPath(); ctx.moveTo(SCX[1],SCY[1]);
    ctx.lineTo(SX[clip.scia.j],SY[clip.scia.j]); ctx.stroke();
    ctx.globalAlpha=1;
  }
  // profondita' per segmento e insertion sort (lista quasi ordinata)
  for(let i=0;i<NS;i++){
    const g=SEGS[i];
    if(g.kind===3){ DEPTH[i]=pallaQui?PSD:1e9; continue; }
    DEPTH[i]=(SD[g.a]+SD[g.b])*0.5+g.bias;
  }
  for(let i=1;i<NS;i++){
    const o=ORD[i], d=DEPTH[o]; let k=i-1;
    while(k>=0 && DEPTH[ORD[k]]<d){ ORD[k+1]=ORD[k]; k--; }
    ORD[k+1]=o;
  }
  // CAPSULE, NON RETTANGOLI: estremi tondi che sporgono oltre il giunto
  // di un raggio — gomiti, ginocchia e spalle pieni anche a 30px. Il
  // lineCap va imposto QUI: il canvas del gioco arriva con 'butt', ed
  // era il 'butt' a lasciare i vuoti ai giunti (a fine figura si rimette).
  ctx.lineCap='round';
  // CONTORNO UNICO (misurato con ?rigcosto: 0,28 -> sotto 0,6 ms per 22
  // figure): un primo passaggio dell'INTERA figura in scuro un filo piu'
  // largo, poi i colori sopra in ordine di profondita'. Cosi' il bordo
  // sta sul PERIMETRO della sagoma e mai fra un segmento e l'altro.
  /* CONTORNO SCALATO: da vicino lo spessore del bordo unico NON cresce
     con lo zoom — resta ~1px a schermo (1,35/lodK), come le pedine vere.
     Sotto soglia la formula e' quella di sempre. */
  /* IL TETTO DEL CONTORNO VALE A TUTTE LE SCALE (A0). Prima si applicava
     solo con lodOn acceso: sotto soglia, in una camera stretta, il bordo
     scuro ingrassava con lo zoom e le tre masse della silhouette (testa,
     busto, gambe) si saldavano in un unico ovale nero. 1-2 px a schermo
     e' il vincolo, e non dipende dal LOD. */
  /* 0,0405 e non 0,035: e' 0,035 compensato del calo d'elevazione, cosi'
     il contorno resta lo stesso NUMERO DI PIXEL di prima. Se ingrassasse
     salderebbe le tre masse; se dimagrisse la sagoma perderebbe il
     perimetro che la stacca dall'erba. */
  let bd=0.0330*s<0.8?0.8:0.0330*s;
  { const mx=1.35/lodK; if(bd>mx)bd=mx; }
  /* =====================================================================
     IL FILO DI STACCO FRA DUE CORPI, e perche' e' una passata e non una
     tinta. Due figure che si sovrappongono portano lo STESSO contorno
     scuro: dove si toccano non c'e' nessun confine, le due sagome si
     saldano e il duello diventa una macchia sola — il «blob» del
     giudice. L'alone di stacco che il gioco ha gia' non lo risolve: e'
     un rialzo di luce SULL'ERBA attorno ai piedi, quindi separa il corpo
     dal prato e non un corpo dall'altro, e per giunta lo disegna la
     figura DIETRO, sotto quella davanti.
     Qui il perimetro si disegna DUE VOLTE: prima chiaro e piu' largo,
     poi scuro alla larghezza di sempre. Il chiaro sporge di filo unita'
     tutto attorno, e siccome la figura davanti si disegna DOPO quella
     dietro, quel filo cade sopra il corpo di dietro: un taglio netto
     esattamente dove serve. Chi non e' in duello non paga niente — il
     chiamante passa filo=0 e la passata non parte.
     Costo: una passata di contorno in piu' (13 tratti) sulle sole figure
     sovrapposte, di norma zero o due per fotogramma.
     ===================================================================== */
  const fl = filo>0 ? filo/lodK : 0;
  /* IL FILO SI DISEGNA IN QUATTRO OPERAZIONI, NON IN TREDICI. Ripetere la
     passata di contorno segmento per segmento costava, misurato con
     prestazione.js sulla scena d'azione, il +18% del fotogramma medio:
     in mischia meta' delle figure e' sopra un'altra, e tredici tratti in
     piu' a testa sono un terzo del costo di una figura. Il filo pero' non
     e' una SAGOMA, e' un ALONE: non gli serve la larghezza esatta di ogni
     osso. Qui gli arti si raggruppano in DUE tracciati soli — i grossi
     (cosce, barra dei fianchi) e i sottili (braccia, tibie, piedi,
     collo) — piu' il trapezio del busto e il cerchio della testa. Quattro
     chiamate al posto di tredici, e il costo torna sotto il rumore.
     Larghezze arrotondate all'insu' del gruppo: un alone un filo piu'
     largo del vero e' esattamente quello che deve essere. */
  if(fl>0){
    const capV=ctx.lineCap; ctx.lineCap='round';
    ctx.strokeStyle=STACCO_FILO;
    for(let k=0;k<2;k++){
      ctx.lineWidth=(k?0.180:0.250)*MSP*s+2*(bd+fl);
      ctx.beginPath();
      for(let i=0;i<NS;i++){
        const g=SEGS[i];
        if(g.kind>=2) continue;                 // testa e palla a parte
        const grosso = g.c==='pantaloncini';    // cosce e barra dei fianchi
        if((k===0)!==grosso) continue;
        ctx.moveTo(SX[g.a],SY[g.a]); ctx.lineTo(SX[g.b],SY[g.b]);
      }
      ctx.stroke();
    }
    ctx.fillStyle=STACCO_FILO;
    troncoQuad(ctx,s,bd+fl,0,1,0,1);
    ctx.beginPath(); ctx.arc(SX[HEAD],SY[HEAD],HEADR*s+bd+fl,0,TAU); ctx.fill();
    ctx.lineCap=capV;
  }
  {
  const bp = bd;
  const tb = BORDO;
  ctx.strokeStyle=tb;
  for(let i=0;i<NS;i++){
    const g=SEGS[i];
    if(g.kind===3) continue;             // la palla ha gia' il suo bordo
    if(g.kind===2){
      ctx.fillStyle=tb;
      ctx.beginPath(); ctx.arc(SX[HEAD],SY[HEAD],HEADR*s+bp,0,TAU); ctx.fill();
      continue;
    }
    /* GOMITI RASTREMATI da vicino: l'avambraccio cala del 20% rispetto
       al braccio (0,160 -> 0,104 effettivo) e la giuntura smette di
       essere un tubo unico. Vale anche per il contorno, che deve seguire
       la stessa sagoma. Sotto soglia niente: le pedine a 30px non lo
       leggerebbero. */
    if(g.kind===1){ ctx.fillStyle=tb; troncoQuad(ctx,s,bp,0,1,0,1); continue; }
    const w=g.w*(g.arti?MSP:1)*s*((lodOn&&(g.b===HAR||g.b===HAL))?0.80:1);
    ctx.lineWidth=(w<1.1?1.1:w)+2*bp;
    /* IL BUSTO NON HA LA CALOTTA IN CIMA — e' la riga che stacca la
       testa dal tronco. Vedi il commento esteso nella passata a colori:
       il contorno deve avere la STESSA sagoma, altrimenti la calotta
       scura ricuce la strozzatura che il colore aveva aperto. */
    const piatto = (g.kind===1||g.pi) && !lodOn;
    if(piatto) ctx.lineCap='butt';
    ctx.beginPath();
    ctx.moveTo(SX[g.a],SY[g.a]); ctx.lineTo(SX[g.b],SY[g.b]);
    ctx.stroke();
    if(piatto) ctx.lineCap='round';
    /* le dita entrano nel perimetro: prima il loro contorno scuro */
    if(lodOn && (g.b===HAR||g.b===HAL)) mano(ctx,s,g.a,g.b,look,bp);
  }
  }
  // dal piu' lontano al piu' vicino
  for(let i=0;i<NS;i++){
    const g=SEGS[ORD[i]];
    if(g.kind===2){ testa(ctx,s,cyw,syw,cam,look); continue; }
    if(g.kind===3){ if(pallaQui) disegnaPalla(ctx,s,look); continue; }
    /* stessa rastrematura del contorno: -20% sull'avambraccio da vicino */
    const w=g.w*(g.arti?MSP:1)*s*((lodOn&&(g.b===HAR||g.b===HAL))?0.80:1), W=w<1.1?1.1:w;
    /* GLI ARTI HANNO UN LATO CALDO E UN LATO FREDDO, senza un tratto in
       piu'. Braccia e gambe si disegnano gia' come tratti singoli: qui si
       SCEGLIE la tinta invece di aggiungerne uno. Se il punto medio del
       segmento sta a EST della verticale del bacino, quell'arto e' dal
       lato in ombra e si disegna nella sua tinta fredda (in cache dentro
       lumiLook). Un confronto per arto, una decina per figura, un paio di
       centinaia a fotogramma: sotto la soglia di misurabilita'.
       Vale identico nelle camere 'alto' e 'bassa', perche' l'ovest e' un
       fatto del MONDO e non dipende da come e' girato il corpo. */
    let tinta=look[g.c];
    if(g.kind===0 && look._ombS){
      const alt=look._ombS[g.c];
      if(alt && (SX[g.a]+SX[g.b])*0.5 > SX[PELVIS]+W*0.18) tinta=alt;
    }
    ctx.strokeStyle=tinta;
    ctx.lineWidth=W;
    if(g.kind===1){ ctx.fillStyle=tinta; troncoQuad(ctx,s,0,0,1,0,1); }
    /* =================================================================
       LA CALOTTA DEL BUSTO E' QUELLA CHE SALDAVA LA TESTA AL TRONCO.
       Misurato sul banco ?banco=silhouette: la maschera nera a 40 px non
       aveva NESSUNA strozzatura fra le tre masse (masse = 0 su nove
       sagome su dieci), e il motivo non era il collo — che a 0,085 e'
       gia' sottile — ma la mezza capsula tonda con cui il tratto del
       busto sporgeva oltre il giunto NECK: mezza larghezza di torso,
       cioe' 3,76 unita' di raggio, mentre la testa sta appena 3,40
       unita' sopra il collo. La calotta arrivava PIU' IN ALTO del
       centro del cranio: testa e busto erano letteralmente lo stesso
       ovale, e nessuna sottigliezza del collo poteva rimediarlo.
       Con l'estremo piatto il tronco finisce dove finisce il collo, e
       il profilo delle scansioni orizzontali scende da 4,31 (la testa) a
       2,64 (il collo) prima di risalire a 3,76 (le spalle): una
       strozzatura del 30%, cioe' il minimo locale che dice «e' un uomo».
       Le spalle NON diventano squadrate: le due capsule delle braccia
       hanno la loro calotta tonda e partono proprio da li'.
       Il fondo del tratto resta coperto dalla barra dei fianchi e dalle
       cosce, quindi il taglio non si vede in basso.
       SOLO SOTTO SOGLIA, e questo e' il compromesso onesto: da vicino
       (il primo piano del gol, il duello) la testa si stacca gia' da
       sola perche' ci sono cento pixel a raccontarla, e li' il taglio
       netto del tronco si vede — legge come una scatola. La spalla
       quadrata e' un rimedio per quaranta pixel, non un disegno.
       Costo: zero — stesso tratto, altro lineCap. */
    const piatto = g.pi && !lodOn;
    if(piatto) ctx.lineCap='butt';
    /* =================================================================
       LA COSCIA NON E' UN PANTALONCINO LUNGO (16 ago 2026).
       Nel primo piano del gol e dei rigori la figura leggeva come un
       MONOLITE: dal bacino alle scarpe un blocco solo nella tinta dei
       calzoncini, perche' il segmento anca-ginocchio e' UNO e portava
       una tinta sola. Un calciatore vestito ha quattro blocchi sulla
       gamba, non uno: calzoncino (largo, meta' alta), COSCIA NUDA,
       calzettone col risvolto, scarpa. Qui si aggiungono i due che
       mancavano — la coscia si disegna in pelle a larghezza ridotta
       (0,82: la gamba e' piu' magra del tessuto) e il calzoncino ci va
       sopra fino al 54%, a larghezza piena.
       SOLO CON lodOn: a quaranta pixel la coscia e' sei unita' e i due
       pezzi diventerebbero tre pixel di fango. Sotto soglia il disegno
       e il costo restano quelli di sempre. */
    if(lodOn && g.cos){
      const alt = tinta!==look[g.c] && look._ombS && look._ombS.pelle;
      ctx.strokeStyle = alt ? look._ombS.pelle : look.pelle;
      ctx.lineWidth = W*0.82;
      ctx.beginPath();
      ctx.moveTo(SX[g.a],SY[g.a]); ctx.lineTo(SX[g.b],SY[g.b]);
      ctx.stroke();
      ctx.strokeStyle = tinta; ctx.lineWidth = W;
      const cax=SX[g.a], cay=SY[g.a];
      ctx.beginPath();
      ctx.moveTo(cax,cay);
      ctx.lineTo(cax+(SX[g.b]-cax)*0.54, cay+(SY[g.b]-cay)*0.54);
      ctx.stroke();
    }else if(g.kind!==1){
      ctx.beginPath();
      ctx.moveTo(SX[g.a],SY[g.a]); ctx.lineTo(SX[g.b],SY[g.b]);
      ctx.stroke();
    }
    if(piatto) ctx.lineCap='round';
    /* MANI a dita al posto del bozzolo (solo da vicino) */
    if(lodOn && (g.b===HAR||g.b===HAL)) mano(ctx,s,g.a,g.b,look,-1);
    /* IL BORDO DI LUCE DA OVEST ANCHE SUGLI ARTI in primo piano (quinto
       appello): il sole delle sette che gia' modella busto e testa lascia
       un velo caldo sul filo ovest di braccia e gambe — un tratto in alfa
       per segmento, solo con lodOn acceso (poche figure, scene ravvicinate:
       il costo non tocca la partita a 22). Il collo, la barra dei fianchi
       e le scarpe restano fuori: troppo corti, il velo diventerebbe rumore. */
    if(lodOn && g.kind===0 && g.c!=='scarpe' && g.b!==HEAD && !(g.a===HIPL&&g.b===HIPR)){
      const ddx=SX[g.b]-SX[g.a], ddy=SY[g.b]-SY[g.a];
      const Lm=Math.sqrt(ddx*ddx+ddy*ddy);
      if(Lm>1.5){
        let nx=-ddy/Lm, ny=ddx/Lm; if(nx>0){nx=-nx;ny=-ny;}   // nx punta a ovest
        ctx.lineCap='butt';
        ctx.globalAlpha=0.16; ctx.strokeStyle='#fff2cf';
        ctx.lineWidth=W*0.30;
        ctx.beginPath();
        ctx.moveTo(SX[g.a]+ddx*0.12+nx*W*0.32, SY[g.a]+ddy*0.12+ny*W*0.32);
        ctx.lineTo(SX[g.a]+ddx*0.88+nx*W*0.32, SY[g.a]+ddy*0.88+ny*W*0.32);
        ctx.stroke();
        ctx.globalAlpha=1; ctx.lineCap='round';
      }
    }
    /* SCARPE distinte da vicino: la suola scura sotto, un lampo chiaro
       sul fianco — due tratti, e la scarpa smette di essere una virgola */
    if(lodOn && g.c==='scarpe'){
      const ax3=SX[g.a],ay3=SY[g.a],dx3=SX[g.b]-ax3,dy3=SY[g.b]-ay3;
      ctx.strokeStyle='#0b0d0e';
      ctx.lineWidth=W*0.34;
      ctx.beginPath();
      ctx.moveTo(ax3+dx3*0.12, ay3+dy3*0.12+W*0.33);
      ctx.lineTo(ax3+dx3*0.96, ay3+dy3*0.96+W*0.33);
      ctx.stroke();
      ctx.strokeStyle='#d8d4c8';
      ctx.lineWidth=W*0.20<0.8?0.8:W*0.20;
      ctx.beginPath();
      ctx.moveTo(ax3+dx3*0.16, ay3+dy3*0.16-W*0.10);
      ctx.lineTo(ax3+dx3*0.60, ay3+dy3*0.60-W*0.18);
      ctx.stroke();
    }
    if(g.riv && look.risvolto){
      /* il RISVOLTO del calzettone: un tratto corto in seconda tinta
         appena sotto il ginocchio — il terzo blocco di colore del kit */
      const ax=SX[g.a],ay=SY[g.a],bx=SX[g.b],by=SY[g.b];
      ctx.strokeStyle=look.risvolto;
      ctx.beginPath();
      ctx.moveTo(ax+(bx-ax)*0.04, ay+(by-ay)*0.04);
      ctx.lineTo(ax+(bx-ax)*0.32, ay+(by-ay)*0.32);
      ctx.stroke();
    }
    if(g.kind===1){
      motivo(ctx,s,look);
      /* il filo di luce/ombra sul busto: tinte pre-calcolate (lumiLook),
         due tratti sottili sui fili ovest/est della capsula del torso */
      if(look._lume===undefined) lumiLook(look);
      const ax=SX[g.a],ay=SY[g.a],dx=SX[g.b]-ax,dy=SY[g.b]-ay;
      const L=Math.sqrt(dx*dx+dy*dy);
      if(L>1.5){
        let nx=-dy/L, ny=dx/L; if(nx>0){nx=-nx;ny=-ny;}   // nx punta a ovest
        if(!lodOn){
          /* ============ IL TERMINATORE, non due bretelle ============
             Prima erano due filetti da W·0,26 appoggiati sui fili della
             capsula: a quaranta pixel di figura leggevano come bretelle,
             non come luce. Adesso sono DUE MEZZE CAPSULE PIENE che si
             dividono tutto il busto — stessi due tratti di prima, solo
             piu' larghi, quindi Δcosto = 0.

             E IL TERMINATORE NON PASSA PER IL CENTRO: sta a 0,72 della
             larghezza dal lato ovest. Non e' un vezzo pittorico, e' cio'
             che rende STABILE la misura del contrasto. collaudo.js
             campiona la maglia in una colonna FISSA sullo schermo,
             x fra -1,5 e +1,5 su un busto largo circa 7,5 unita': con il
             terminatore in mezzo quella colonna cadrebbe a cavallo delle
             due tinte e il numero diventerebbe un caso, diverso a ogni
             posa. A 0,72 il confine cade a 0,22·W ≈ 1,65 unita' a est del
             centro, cioe' FUORI dalla colonna: il campione sta tutto nel
             lato in LUCE, e siccome _lume e' piu' chiaro della maglia
             base il rapporto puo' solo migliorare.
             Lo si legge anche al contrario: se un giorno qualcuno
             riporta il terminatore al centro, il cancello del contrasto
             comincera' a ballare e nessuno sapra' perche'.

             DA 0,72 A 0,78, E IL MOTIVO E' MISURATO (onda delle figure).
             Il conto sopra dava 1,65-1,95 unita' di margine sulla colonna
             a ±1,5 SUPPONENDO l'asse del busto sulla verticale del
             giocatore. Non ci sta: il busto e' INCLINATO in avanti, e in
             pianta l'inclinazione diventa uno scarto ORIZZONTALE quando
             la figura corre di traverso — z·sin(yaw)·s, che con lean 0,24
             vale gia' 3,5 unita', otto volte il margine. Meta' delle
             direzioni di marcia porta il confine DENTRO la colonna, la
             mediana comincia a pescare il lato freddo, e il rapporto
             misurato della maglia P1 crolla senza che nessuno abbia
             toccato un colore: 2,96:1 sulla sonda isolata. A 0,78 il
             confine sta a 0,28·W ≈ 2,5 unita' a est e il lato in ombra
             resta ampio (il 22% del busto): la legge della luce vale
             ancora, la misura smette di ballare. */
          const TERM=0.78;
          ctx.fillStyle=look._lume;  troncoQuad(ctx,s,0,0,TERM,0.06,0.94);
          ctx.fillStyle=look._ombra; troncoQuad(ctx,s,0,TERM,1,0.06,0.94);
        }else{
          /* MAGLIA VERA da vicino: i fili pieni di _lume/_ombra a questa
             scala leggevano come BRETELLE (misurato al primo giro di
             foto). Al loro posto due VELI in alfa a estremi piatti —
             mezza capsula ovest in luce, mezza est in ombra — che
             modellano il tessuto anche sopra strisce e fascia. */
          /* stesso terminatore decentrato, ma in VELI d'alfa: da vicino il
             tessuto ha strisce e fasce sotto, e due tinte piene le
             cancellerebbero. La coppia caldo/freddo e' la stessa della
             legge della luce — ambra a ovest, cielo a est. */
          const TERM=0.72;
          ctx.globalAlpha=0.17; ctx.fillStyle='#ffe9b8';
          troncoQuad(ctx,s,0,0,TERM,0.06,0.94);
          ctx.globalAlpha=0.30; ctx.fillStyle=SOLE.tintaOmbra;
          troncoQuad(ctx,s,0,TERM,1,0.06,0.94);
          ctx.globalAlpha=1;
          /* e il COLLETTO in seconda tinta, appena sotto il collo */
          ctx.strokeStyle=look.maglia2;
          ctx.lineWidth=0.058*s<1?1:0.058*s;
          ctx.beginPath();
          ctx.moveTo(ax+dx*0.965+nx*0.110*s, ay+dy*0.965+ny*0.110*s);
          ctx.lineTo(ax+dx*0.965-nx*0.110*s, ay+dy*0.965-ny*0.110*s);
          ctx.stroke();
        }
      }
    }
  }
  ctx.lineCap='butt';                    // lo stato del canvas torna com'era
}

/* ADATTAMENTO (c): il torso dell'ultima figura, per ancorare il numero */
const TORSO={x0:0,y0:0,x1:0,y1:0};

const lookPredefinito={
  maglia:'#c9302c', maglia2:'#f5f2ea', disegno:'strisce',
  pantaloncini:'#f5f2ea', calze:'#c9302c', risvolto:'#f5f2ea',
  pelle:'#e0a97e', capelli:'#33210f', scarpe:'#1d1d1d',
  palla:'#f4f2ec', taglio:1,
};

/* =====================================================================
   IL BANCO DELLA GABBIA — la libreria si lascia ISPEZIONARE (?gabbia).
   Non e' un modo di disegnare a parte (un banco che disegna «a modo suo»
   mente): e' la STESSA pose() della partita, valutata sugli stessi
   scratch, e la lettura dei giunti che ne esce.
   Costo nel fotogramma: zero. Sono riferimenti a oggetti gia' esistenti,
   costruiti una volta al caricamento del modulo.

   OSSA e' l'elenco dei segmenti a lunghezza COSTANTE per costruzione:
   se la cinematica diretta e' onesta, la distanza fra i due giunti vale
   sempre L, in ogni clip, a ogni fase, per ogni corporatura. Lo scarto
   percentuale da L e' la misura che trasforma «spaghetti con la testa»
   da opinione in cancello (±1,0%).
   ===================================================================== */
/* La lunghezza nominale e' una FUNZIONE e non un numero perche' le
   misure vive cambiano con la CORPORATURA: il metro dello spilungone
   non e' quello del tarchiato, e un banco che li misurasse tutti col
   metro della taglia media stamperebbe un 3% di scarto inventato su
   ogni osso lungo. Le chiusure nascono una volta al caricamento. */
const OSSA=[
  {n:'busto',        a:PELVIS,b:NECK, f:()=>0.46},
  {n:'pelvi-torace', a:PELVIS,b:CHEST,f:()=>0.34},
  {n:'torace-collo', a:CHEST, b:NECK, f:()=>0.12},
  {n:'collo',        a:NECK,  b:HEAD, f:()=>0.19},
  {n:'spalle',       a:SHL,   b:SHR,  f:()=>2*SHW},
  {n:'fianchi',      a:HIPL,  b:HIPR, f:()=>2*HIPW},
  {n:'braccioR',     a:SHR,b:ELR, f:()=>UA},
  {n:'avambraccioR', a:ELR,b:HAR, f:()=>FA},
  {n:'braccioL',     a:SHL,b:ELL, f:()=>UA},
  {n:'avambraccioL', a:ELL,b:HAL, f:()=>FA},
  {n:'cosciaR',      a:HIPR,b:KNR, f:()=>THIGH},
  {n:'tibiaR',       a:KNR, b:FTR, f:()=>SHIN},
  {n:'piedeR',       a:FTR, b:TOR, f:()=>FOOT},
  {n:'cosciaL',      a:HIPL,b:KNL, f:()=>THIGH},
  {n:'tibiaL',       a:KNL, b:FTL, f:()=>SHIN},
  {n:'piedeL',       a:FTL, b:TOL, f:()=>FOOT},
];
/* valuta una posa e restituisce lo scarto peggiore fra tutte le ossa,
   piu' la quota del giunto piu' basso (il piede che non deve bucare) */
const ESITO={osso:'',scarto:0,quota:0,cima:0};
function bancoPosa(nomeClip,u){
  CLIPS[nomeClip].pose(u);
  let peggio=0, chi='', minY=1e9;
  for(let i=0;i<OSSA.length;i++){
    const o=OSSA[i];
    const dx=P[o.a*3]-P[o.b*3], dy=P[o.a*3+1]-P[o.b*3+1], dz=P[o.a*3+2]-P[o.b*3+2];
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz), L=o.f();
    const sc=(d-L)/L;
    if(Math.abs(sc)>Math.abs(peggio)){ peggio=sc; chi=o.n; }
  }
  for(let j=0;j<NJ;j++){ const y=P[j*3+1]; if(y<minY)minY=y; }
  ESITO.osso=chi; ESITO.scarto=peggio; ESITO.quota=minY;
  ESITO.cima=P[HEAD*3+1]+HEADR;
  return ESITO;
}

return {disegna, CAMERE, CLIPS, lookPredefinito};
})();

/* ============================================================
   Pagina di prova
   ============================================================ */
(function(){
const Q=new URLSearchParams(location.search);
const selClip=document.getElementById('selClip'),
      selCam=document.getElementById('selCam'),
      selYaw=document.getElementById('selYaw'),
      selVel=document.getElementById('selVel'),
      selEntrambe=document.getElementById('selEntrambe'),
      lblYaw=document.getElementById('lblYaw'),
      lblVel=document.getElementById('lblVel');
if(Q.get('clip')) selClip.value=Q.get('clip');
if(Q.get('camera')) selCam.value=Q.get('camera');
if(Q.get('angolo')) selYaw.value=Q.get('angolo');
if(Q.get('griglia')==='entrambe') selEntrambe.checked=true;
const fase = Q.get('fase')!==null ? parseFloat(Q.get('fase')) : null;
const STRISCIA = Q.get('striscia')==='1';   // 8 fotogrammi della clip, stesso angolo

const DPR=window.devicePixelRatio||1;
const ant=document.getElementById('anteprima');
ant.width=300*DPR; ant.height=300*DPR;
ant.style.width='300px'; ant.style.height='300px';
const antCtx=ant.getContext('2d');
antCtx.setTransform(DPR,0,0,DPR,0,0); antCtx.lineCap='round';

/* griglia: la stessa clip a 8 angoli, a 90px e a 30px, per camera */
const griglia=document.getElementById('griglia');
const righe=[];
function faRiga(tit,hFig,cw,chh,scala){
  const div=document.createElement('div'); div.className='riga';
  const t=document.createElement('div'); t.className='tit'; t.textContent=tit;
  const cv=document.createElement('canvas');
  const W=cw*8, H=chh;
  if(scala===1){ // riga 30px: backing 1:1 e CSS x2 pixelato (com'e' in partita)
    cv.width=W; cv.height=H; cv.className='px30';
    cv.style.setProperty('--w',W); cv.style.setProperty('--h',H);
  }else{
    cv.width=W*DPR; cv.height=H*DPR;
    cv.style.width=W+'px'; cv.style.height=H+'px';
  }
  div.appendChild(t); div.appendChild(cv); griglia.appendChild(div);
  const ctx=cv.getContext('2d');
  if(scala!==1) ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.lineCap='round';
  righe.push({ctx,hFig,cw,chh,tit});
  return righe[righe.length-1];
}
function costruisciGriglia(){
  griglia.innerHTML=''; righe.length=0;
  const cams=selEntrambe.checked?['alto','bassa']:[selCam.value];
  for(const cam of cams){
    faRiga('camera '+cam+' — 90 px',90,112,132,0).cam=cam;
    faRiga('camera '+cam+' — 30 px (scala reale di partita, mostrata x2)',30,46,56,1).cam=cam;
  }
}
costruisciGriglia();
selEntrambe.addEventListener('change',costruisciGriglia);
selCam.addEventListener('change',costruisciGriglia);

const look=Rig3D.lookPredefinito;
const RAD=Math.PI/180;

function tClip(now){
  const vel=selVel.value/100;
  if(fase!==null) return fase/Rig3D.CLIPS[selClip.value].freq;
  return now*0.001*vel;
}

function quadro(now){
  const t=tClip(now), clip=selClip.value;
  lblYaw.textContent=selYaw.value+'°';
  lblVel.textContent=(selVel.value/100).toFixed(1)+'×';
  // anteprima grande
  antCtx.fillStyle='#2e7d3f'; antCtx.fillRect(0,0,300,300);
  antCtx.fillStyle='#28703a'; antCtx.fillRect(0,150,300,4);
  Rig3D.disegna(antCtx,150,240,170,selYaw.value*RAD,selCam.value,clip,t,look);
  // griglia
  for(const r of righe){
    const ctx=r.ctx;
    for(let i=0;i<8;i++){
      ctx.fillStyle=(i%2)?'#2e7d3f':'#2a7439';
      ctx.fillRect(i*r.cw,0,r.cw,r.chh);
      // striscia temporale: stesso angolo, 8 fasi; griglia normale: 8 angoli
      const yawT=STRISCIA?selYaw.value*RAD:i*45*RAD;
      const uT=(i+0.5)/8;
      const tT=STRISCIA?uT/Rig3D.CLIPS[clip].freq:t;
      Rig3D.disegna(ctx,i*r.cw+r.cw/2,r.chh*0.82,r.hFig,yawT,r.cam,clip,tT,look);
      if(r.hFig>50){
        ctx.fillStyle='#dff2e2'; ctx.font='10px monospace'; ctx.textAlign='center';
        ctx.fillText(STRISCIA?'u='+uT.toFixed(2):(i*45)+'°', i*r.cw+r.cw/2, 12);
      }
    }
  }
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);

/* --- misura del costo: 22 figure x 600 frame, come in partita.
       ?clipcosto=tiro misura una clip diversa (es. quelle con la palla) --- */
setTimeout(function(){
  const clipCosto=(Q.get('clipcosto')&&Rig3D.CLIPS[Q.get('clipcosto')])?Q.get('clipcosto'):'corsa';
  const cv=document.createElement('canvas'); cv.width=480; cv.height=320;
  const ctx=cv.getContext('2d'); ctx.lineCap='round';
  const t0=performance.now();
  for(let f=0;f<600;f++){
    ctx.fillStyle='#2e7d3f'; ctx.fillRect(0,0,480,320);
    for(let i=0;i<22;i++){
      Rig3D.disegna(ctx, 30+(i%8)*55, 60+((i/8)|0)*90, 30,
        i*0.7, i<11?'alto':'alto', clipCosto, f/60+i*0.13, look);
    }
  }
  const ms=(performance.now()-t0)/600;
  const msg='COSTO ('+clipCosto+'): 22 figure = '+ms.toFixed(3)+' ms/frame ('+
            (1000/ms).toFixed(0)+' fps teorici, canvas 2D)';
  console.log(msg);
  document.getElementById('costo').textContent=msg;
},600);
})();
</script>
