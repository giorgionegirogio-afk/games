<!--
  RIG.html — Rig3D: figure pseudo-3D per CALCETTO
  ================================================
  Libreria PURA in canvas 2D, zero dipendenze, zero immagini.
  Scheletro a 18 giunti 3D, pose per curve di fase, yaw 0-360°,
  due camere preimpostate: "alto" (partita, top-down inclinata)
  e "bassa" (rigori e riprese del gol, dietro il giocatore).
  Disegno a capsule con spessore, ordinate per profondita' camera.

  COSTO MISURATO (22 figure x 600 frame, 30px, camera alto,
  Chromium headless su questa macchina, 2026-08-14, dopo la passata
  su tuffo (volo vero), palla (velocita' d'uscita + prospettiva PRF +
  scia a fantasmi), frenata (compasso + bilanciere + solchi) e
  rovesciata (scia del piede, ombra a distacco quadratico):
    clip camminata:          ~1.3 ms/frame per TUTTE le 22 figure (~760 fps)
    clip corsa:              ~1.4 ms/frame                        (~710 fps)
    clip frenata (solchi):   ~1.6 ms/frame                        (~620 fps)
    clip tiro (palla+scia):  ~1.6 ms/frame                        (~610 fps)
    clip finta (palla):      ~1.7 ms/frame                        (~600 fps)
    clip tuffo (palla, volo,
      polvere):              ~1.85 ms/frame                       (~540 fps)
    clip rovesciata (palla, scia
      piede, ombra+polvere): ~1.86 ms/frame                       (~538 fps)
    le altre clip stanno tra questi estremi.
    => <0.1 ms a figura: a 60 fps il rig usa ~11% del bilancio di frame,
       e resta sotto i ~2 ms per 22 figure anche nelle clip peggiori.
  La stessa misura gira a ogni apertura della pagina (?clipcosto=nome
  per misurare un'altra clip): il numero fresco appare in console e
  nell'angolo in basso a destra.

  Bilancio per figura per frame: ~34 sin/cos, ~18 tracciati canvas
  (capsule stroke + 2 arc testa + 1 ellisse ombra), ZERO allocazioni
  (tutti gli array sono riusati, l'ordinamento e' un insertion sort
  su un array di indici persistente).
-->

<script>
'use strict';
/* ============================================================
   Rig3D — libreria pura. Nessuna allocazione per fotogramma.
   ============================================================ */
/* IL SOLE, COPIATO DAL GIOCO E NON REINVENTATO. La libreria qui sotto
   e' la stessa riga per riga di CALCETTO-il-gioco.html, e da quando la
   luce e' diventata costituzionale (un solo sole, terminatore ambra a
   ovest e viola-blu a est) legge SOLE.tintaOmbra. Nella bozza il sole
   non c'e', percio' si dichiara qui il MEDESIMO valore del gioco: se un
   giorno divergono, la bozza mostra una luce che in campo non esiste —
   ed e' esattamente il motivo per cui sta scritta accanto alla libreria
   e non altrove. Fonte: CALCETTO-il-gioco.html, const SOLE. */
const SOLE={ dir:[0.9406,0.3402], alt:20, lung:2.747, k:2.2,
  caldo:'255,222,164', cielo:'70,110,205', freddo:'86,94,124',
  tintaOmbra:'#2a3358' };

const Rig3D = (function(){
const TAU = Math.PI*2;

/* --- giunti (indici) --- */
const PELVIS=0,CHEST=1,NECK=2,HEAD=3,
      SHL=4,ELL=5,HAL=6, SHR=7,ELR=8,HAR=9,
      HIPL=10,KNL=11,FTL=12, HIPR=13,KNR=14,FTR=15,
      TOL=16,TOR=17, NJ=18;

/* --- misure del corpo (metri, altezza ~1.83) ---
   HEADR e' salito da 0,155 a 0,179 e NON e' un ingrandimento: e' la
   compensazione esatta del calo d'elevazione della camera in pianta
   (50 -> 42 gradi, vedi CAMERE). La scala orizzontale s vale
   hPx/(1,9·cos E) e passa da 27,84 a 24,08, cioe' ×0,865: 0,155/0,865 =
   0,179 e il cerchio della testa resta 4,3 unita' A SCHERMO, identico
   al pixel. E' un invariante dichiarato, non un dettaglio: la sonda
   dell'ERBA di collaudo.js esclude i corpi fino a -26 unita' sopra il
   centro e la cima della testa sta a -27,7 — ingrandire la testa
   davvero, o alzare le figure, spingerebbe pelle e capelli dentro
   l'anello dell'erba e il rapporto di contrasto cambierebbe senza che
   la maglia sia stata toccata. Il banco ?gabbia stampa quella cima. */
/* LE MISURE SONO DUE FILE: le NOMINALI (la taglia media, costanti e
   inviolabili — sono il metro del banco ?gabbia) e le VIVE, che valgono
   per la figura in corso di disegno. Fra una figura e l'altra le vive
   cambiano di qualche punto percentuale: e' la CORPORATURA (vedi CORPI).
   Non e' una variabile per fotogramma travestita da costante: si scrive
   UNA volta per figura, prima della posa, e non alloca niente. */
/* LE SPALLE SONO SALITE DA 0,20 A 0,22 (semilarghezza), ed e' una
   misura della SAGOMA, non del gusto. Sul banco ?banco=silhouette la
   maschera nera a quaranta pixel dava una testa larga 13 px contro un
   corpo largo 17: il 76%, cioe' nessuna delle tre masse si staccava
   dalle altre e il profilo delle scansioni saliva monotono dalla cima
   dei capelli ai piedi — «un ovale con le gambe». Il rimedio non poteva
   essere rimpicciolire la testa (la giuria chiede il contrario, e la
   cima del cranio e' l'invariante che protegge la sonda dell'erba):
   doveva essere ALLARGARE le spalle. A 0,22 le spalle stanno a 20 px
   contro i 13 della testa, la V del torace si legge, e le braccia
   partono piu' lontane dal busto — che e' anche la seconda regola della
   silhouette, «nessun arto appoggiato alla massa centrale».
   Non oltre: a 0,235, guardata nel primo piano del gol, la figura
   diventava un frigorifero. La sagoma si giudica a quaranta pixel ma si
   paga anche a quattrocento, e fra le due misure comanda l'occhio.
   I fianchi restano a 0,105: e' la V a fare l'atleta. */
const N_THIGH=0.46, N_SHIN=0.45, N_UA=0.27, N_FA=0.25, N_FOOT=0.145,
      N_SHW=0.22, N_HEADR=0.179;
let THIGH=N_THIGH, SHIN=N_SHIN, UA=N_UA, FA=N_FA, FOOT=N_FOOT,
    SHW=N_SHW, HEADR=N_HEADR;
const HIPW=0.105;                    // i fianchi NON cambiano: vedi CORPI

/* =====================================================================
   LE TRE CORPORATURE, e le due righe che non si toccano.

   Tre uomini diversi, non tre scale dello stesso uomo: chi ha gli arti
   sottili ha anche le spalle strette e la testa piccola; chi e' largo di
   spalle ha gli arti grossi e le braccia corte. I fattori vanno in
   direzioni OPPOSTE, ed e' quello che raddoppia la differenza di sagoma
   fra due figure affiancate — il punto di tutta la manovra.

   LE TRE GRANDEZZE CHE NON VARIANO, e la ragione e' un cancello:
     - la LARGHEZZA del busto (il segmento PELVIS-NECK dei SEGS);
     - l'ALTEZZA A SCHERMO hb, che sta nell'adattatore e resta RIG_H;
     - la LUNGHEZZA DELLE GAMBE (g resta 1,00 per tutti e tre).
   La sonda del contrasto di collaudo.js campiona una finestra FISSA
   sullo schermo — tre file a -12,5/-11,5/-10,5 unita' sopra il centro
   del giocatore, colonna ±1,5 — mentre il torso e' un oggetto che si
   muove con le proporzioni. Le prime due erano dichiarate in partenza.
   La terza e' una RETTIFICA MISURATA, e vale la pena scriverla per
   esteso perche' il piano diceva il contrario.

   Il piano prevedeva che il bacino seguisse la lunghezza delle gambe:
   gambe piu' lunghe, uomo piu' alto a parita' di piedi per terra. E'
   anatomia giusta e sullo schermo si vede. Ma la sonda isolata (stesso
   seme di collaudo.js) l'ha misurata cosi', sul rapporto maglia/erba:
     senza corporature ....... 3,20 / 3,99 / 4,66 / 4,08
     corporature col bacino .. 2,74 / 3,39 / 4,54 / 3,72   (-0,46 su P1)
     corporature senza bacino  3,02 / 4,17 / 4,67 / 4,10
   Cinque centimetri di bacino costavano fino a 0,6 di rapporto: la
   finestra della sonda scorre sul torso e va a pescare la seconda tinta
   o il lato in ombra. Il contrasto maglia/manto e' il primo dei rischi
   dichiarati dell'onda («e' gia' successo due volte»), e non si spende
   per una differenza di un'unita' di schermo su quaranta.
   Cosa resta della differenza di statura: le gambe sono lunghe uguali,
   ma con la testa piu' grossa del 5% e le spalle piu' strette del 3% il
   piccoletto legge piu' basso comunque — e' il rapporto a dire l'eta'
   e la taglia, non i centimetri.

   Il meccanismo del bacino (DP/DPQ) resta scritto e funzionante, con g
   a 1,00: serve com'e' il giorno che qualcuno voglia riprovarci, e la
   prima cosa che quel qualcuno deve fare e' rilanciare la sonda.
   ===================================================================== */
const CORPI=[
  /* 0 spilungone */ {g:1.00, b:1.04, sp:0.88, sh:0.96, hr:0.96},
  /* 1 tarchiato  */ {g:1.00, b:0.97, sp:1.14, sh:1.06, hr:1.00},
  /* 2 piccoletto */ {g:1.00, b:0.95, sp:1.00, sh:0.98, hr:1.05},
  /* 3 neutro: la taglia nominale. E' quella del banco e delle scene
     fuori partita (duello, ripresa del gol), dove la figura e' una sola
     e non c'e' nessuno da cui distinguerla. */
                     {g:1.00, b:1.00, sp:1.00, sh:1.00, hr:1.00},
];
let DP=0;        // scarto di quota del bacino dovuto alla lunghezza delle gambe
/* DPQ — lo stesso scarto, SPENTO QUANDO IL CORPO E' A TERRA.
   Un uomo con le gambe piu' corte sta piu' basso, in piedi. Steso sul
   manto no: la scivolata, la rovesciata, la parata e la caduta in
   ginocchio hanno il bacino gia' appoggiato, e sottrargli altri cinque
   centimetri gli sprofonda il ginocchio sotto l'erba — misurato dal
   banco, -0,080 m contro i -0,050 di mezza capsula ammessi. Percio' lo
   scarto sfuma con la quota del bacino: pieno sopra 0,72 m (tutte le
   pose in piedi, che stanno fra 0,78 e 0,93), nullo sotto 0,42, lineare
   in mezzo. Lo calcola corpo(), che ogni posa chiama per
   prima, e lo consumano gamba() e le braccia: una sola sorgente, quindi
   anche a meta' rampa i fianchi restano attaccati al bacino. */
let DPQ=0;
let MSP=1;       // moltiplicatore di SPESSORE degli arti (solo disegno)
let VARB=0;      // micro-variazione delle braccia, per seme (rad, antisimmetrica)
let CORP_ORA=3;
function corpora(c,vb){
  c=(c|0); if(c<0||c>3)c=3;
  VARB=vb||0;
  if(c===CORP_ORA) return;                  // la maggior parte delle volte
  CORP_ORA=c;
  const q=CORPI[c];
  THIGH=N_THIGH*q.g; SHIN=N_SHIN*q.g; FOOT=N_FOOT*q.g;
  UA=N_UA*q.b; FA=N_FA*q.b;
  SHW=N_SHW*q.sh; HEADR=N_HEADR*q.hr;
  GAMBA_L=THIGH+SHIN;
  DP=GAMBA_L-(N_THIGH+N_SHIN);
  MSP=q.sp;
}

/* --- scratch riusati: MAI allocati nel frame --- */
const P  = new Float32Array(NJ*3);   // posa locale (x lato, y su, z avanti)
const SX = new Float32Array(NJ);     // proiezione schermo x
const SY = new Float32Array(NJ);     // proiezione schermo y
const SD = new Float32Array(NJ);     // profondita' camera

/* --- palla (per le clip che la includono): scratch riusato --- */
const RPALLA=0.11;
const PALLA=new Float32Array(4);     // x,y,z,schiacciata
let PSX=0,PSY=0,PSD=0;               // proiezione schermo della palla
let PRF=1;                           // fattore prospettico della sola palla
const PALLB=new Float32Array(4);     // fantasma della scia (riusato)
const GHX=new Float32Array(2), GHY=new Float32Array(2);   // scia palla
const SCX=new Float32Array(2), SCY=new Float32Array(2);   // scia piede

/* rampa morbida 0->1 tra a e b */
function sm(u,a,b){ let t=(u-a)/(b-a); if(t<0)t=0; else if(t>1)t=1; return t*t*(3-2*t); }

function setJ(j,x,y,z){ P[j*3]=x; P[j*3+1]=y; P[j*3+2]=z; }

/* =====================================================================
   L1 — LA GABBIA STRUTTURALE: ogni giunto nasce RUOTANDO un segmento di
   lunghezza costante, e la lunghezza diventa inviolabile per costruzione.

   Com'era, e perche' fabbricava marionette (misurato col banco ?gabbia,
   20 clip su 20 fuori gabbia prima di questa riparazione):
     1. il gomito stava a ex = sx + out*side, uno scostamento LATERALE
        ADDITIVO: la distanza spalla-gomito diventava sqrt(out²+UA²) e il
        braccio si ALLUNGAVA piu' si apriva — +72% in frenata, +55% in
        rovesciata. E' letteralmente lo spaghetto;
     2. il ginocchio stava a kx=(hx+fx)*0,5, la media aritmetica fra anca
        e piede DICHIARATO dalla posa: la coscia usciva dal piano della
        gamba e si allungava fino a +12% (finta);
     3. `if(fy<0.045) fy=0.045` risolveva il contatto col suolo sulla
        LUNGHEZZA invece che sull'angolo: la tibia si accorciava fino a
        -95% (rovesciata), -38% (tiro), -19% (corsa). E' il difetto che
        la giuria chiama «proporzioni incoerenti fra figure vicine»,
        perche' due giocatori nella stessa andatura a fase diversa hanno
        tibie visibilmente diverse.

   Com'e' adesso: ogni osso e' un VERSORE per la sua lunghezza. Un versore
   ha modulo uno, quindi l'osso ha modulo L — non c'e' un fotogramma in
   cui possa essere altrimenti, e il banco lo verifica su 64 fasi per clip.

   LA FIRMA NON CAMBIA, e questo e' voluto: `out` e `fx` restano quello
   che le ventotto chiamate esistenti passano gia' (uno scostamento
   laterale in metri), ma qui dentro si CONVERTONO in un angolo di
   abduzione. Cosi' la posizione laterale che la posa chiedeva viene
   rispettata ESATTAMENTE — UA·sin(ab) = out, (THIGH+SHIN)·sin(ap) = fx-hx
   — mentre e' la discesa verticale a raccorciarsi del coseno, che e'
   l'anatomia giusta: una gamba divaricata arriva piu' in alto.
   L'unico taglio e' quello dell'asin, cioe' l'arto teso in orizzontale:
   oltre non si va perche' oltre non c'e' niente.
   ===================================================================== */
let GAMBA_L=THIGH+SHIN;                      // la leva completa dell'anca
const PIEDE_Y=0.045;                         // la caviglia appoggiata a terra
const PUNTA_Y=0.012;                         // e la punta della scarpa

/* =====================================================================
   L2 — LA SCATOLA DEGLI ANGOLI: nessun arto in configurazione
   anatomicamente impossibile, in nessun fotogramma di nessuna clip.

   L1 (sopra) garantisce che un osso sia lungo quanto e' lungo. Non
   garantisce che il ginocchio non si pieghi ALL'INDIETRO, ne' che il
   gomito non si spezzi in avanti: quelle sono proprieta' dell'ANGOLO, e
   una tabella di numeri scritta a mano non si autocontrolla. La scatola
   e' un prodotto di intervalli, quindi CONVESSA: l'interpolazione di due
   pose legali e' legale per costruzione — e' un teorema, non una
   speranza, ed e' la ragione per cui il clamp sta qui e non nel disegno.

   I limiti, e da dove vengono:
     ginocchio  0 .. 2,45 rad. Zero perche' un ginocchio non si inverte;
                140 gradi perche' oltre il tallone tocca il gluteo.
     gomito     0 .. 2,70 rad, per la stessa ragione dall'altra parte.
     abduzione  |ab| <= 1,05 rad. Il braccio si alza di lato fino a
                sessanta gradi buoni prima che la scapola debba ruotare,
                e la scapola nel rig non c'e'. Sopra, il braccio sarebbe
                appeso alla spalla in un modo che nessuno fa.
     anca       |apertura| <= 0,85 rad, la divaricata di un atleta.

   L3 — L'ACCOPPIAMENTO che una scatola non sa esprimere: un braccio
   spalancato non ha il gomito TESO. E' l'unico dei tre accoppiamenti
   previsti che si applica, e la ragione per gli altri due sta scritta
   sotto, in gamba().

   IL CANCELLO NON E' «zero tagli»: e' «i tagli si contano». TAGLI
   conta quante volte la scatola ha dovuto correggere una posa, e il
   banco ?gabbia lo stampa per clip. Una posa che viene corretta e' una
   posa scritta male: il rimedio giusto e' cambiare il numero nel foglio,
   non lasciare che sia il clamp a scriverlo ogni fotogramma.
   ===================================================================== */
const K_MIN=0, K_MAX=2.45;        // ginocchio
const E_MIN=0, E_MAX=2.70;        // gomito
const AB_MAX=0.8674;              // sin(1,05): l'abduzione entra come seno
const AP_MAX=0.7513;              // sin(0,85): l'apertura d'anca, idem
let TAGLI=0;

/* --- FK gamba: a = angolo coscia avanti dal filo a piombo, knee =
   flessione, fx = x del piede voluta (diventa apertura d'anca) --- */
function gamba(hip,kn,ft,toe, hx,hy,hz, a,knee, fx){
  hy+=DPQ;                                   // la corporatura alza o abbassa l'anca
  /* L2 sul GINOCCHIO. Gli altri due accoppiamenti previsti da L3 —
     «bacino basso implica ginocchia piegate» e «busto inclinato implica
     anca che bilancia» — NON si applicano, ed e' una scelta misurata:
     la scivolata ha il bacino a 0,32 e la gamba tesa avanti a 0,10 di
     flessione, che e' proprio il gesto; imporle 1,34 rad di piega
     cancellerebbe la posa che la giuria deve riconoscere in silhouette.
     Un accoppiamento che vale per le pose in piedi e sbaglia su quelle a
     terra non e' una legge, e' un caso particolare travestito. */
  if(knee<K_MIN){ knee=K_MIN; TAGLI++; } else if(knee>K_MAX){ knee=K_MAX; TAGLI++; }
  const b=a-knee;
  let sp=(fx-hx)/GAMBA_L;                    // seno dell'apertura d'anca
  if(sp>AP_MAX){ sp=AP_MAX; TAGLI++; } else if(sp<-AP_MAX){ sp=-AP_MAX; TAGLI++; }
  const cp=Math.sqrt(1-sp*sp);               // coseno, senza un altro trig
  const lat=GAMBA_L*sp;                      // lo scarto laterale voluto, esatto
  let kx=hx+THIGH*sp, ky=hy-THIGH*cp*Math.cos(a), kz=hz+THIGH*cp*Math.sin(a);
  let fxx=hx+lat, fyy=ky-SHIN*cp*Math.cos(b), fzz=kz+SHIN*cp*Math.sin(b);
  if(fyy<PIEDE_Y){
    /* ======= IL CONTATTO COL SUOLO SI RISOLVE SULL'ANGOLO =======
       Qui stava `if(fy<0.045) fy=0.045`, una riga che alzava la caviglia
       lasciando il ginocchio dov'era: cioe' ACCORCIAVA LA TIBIA, fino al
       -95% misurato sulla rovesciata. Al suo posto la IK a due leve: la
       caviglia va a quota, e il GINOCCHIO SI PIEGA per arrivarci. Le due
       ossa restano lunghe quanto sono, per costruzione.
       Costa un paio di radici, e solo nei fotogrammi in cui serve
       davvero: un piede che sta gia' sopra il campo non entra qui. */
    fyy=PIEDE_Y;
    let vx=fxx-hx, vy=fyy-hy, vz=fzz-hz;
    let d2=vx*vx+vy*vy+vz*vz, d=Math.sqrt(d2);
    const DMAX=GAMBA_L*0.998;                // la gamba non si tende oltre se stessa
    if(d>DMAX){
      /* fuori portata: si accorcia il passo ORIZZONTALE, mai la gamba */
      const oz=Math.sqrt(vx*vx+vz*vz);
      const rimane=DMAX*DMAX-vy*vy;
      const perm=rimane>0?Math.sqrt(rimane):0;
      const k2=oz>1e-6?perm/oz:0;
      vx*=k2; vz*=k2; fxx=hx+vx; fzz=hz+vz;
      d=Math.sqrt(vx*vx+vy*vy+vz*vz); d2=d*d;
    }
    if(d<1e-4){ d=1e-4; d2=1e-8; vy=-d; }
    const ux=vx/d, uy=vy/d, uz=vz/d;
    /* il ginocchio: sull'asse anca-caviglia di a1, poi scostato in
       perpendicolare di hq — nel piano in cui il ginocchio gia' punta,
       cosi' non si rovescia mai all'indietro */
    const a1=(THIGH*THIGH-SHIN*SHIN+d2)/(2*d);
    let hq=THIGH*THIGH-a1*a1; hq=hq>0?Math.sqrt(hq):0;
    let wx=kx-hx, wy=ky-hy, wz=kz-hz;
    const pr=wx*ux+wy*uy+wz*uz;
    let px=wx-ux*pr, py=wy-uy*pr, pz=wz-uz*pr;
    let pl=Math.sqrt(px*px+py*py+pz*pz);
    if(pl<1e-5){
      /* gamba gia' tesa: nessun piano dichiarato dal ginocchio. Si prende
         l'AVANTI del corpo (z+) tolta la componente lungo l'asse; se anche
         quello e' degenere (gamba distesa in avanti) si ripiega sul lato. */
      px=-ux*uz; py=-uy*uz; pz=1-uz*uz;
      pl=Math.sqrt(px*px+py*py+pz*pz);
      if(pl<1e-5){ px=1-ux*ux; py=-uy*ux; pz=-uz*ux; pl=Math.sqrt(px*px+py*py+pz*pz); }
      if(pl<1e-5){ px=0; py=0; pz=1; pl=1; }
    }
    const bx=hx+ux*a1, by=hy+uy*a1, bz=hz+uz*a1;   // il piede della perpendicolare
    px/=pl; py/=pl; pz/=pl;
    kx=bx+px*hq; ky=by+py*hq; kz=bz+pz*hq;
    /* IL GINOCCHIO NON AFFONDA NEL CAMPO. Con il bacino a terra (scivolata,
       rovesciata, tuffo, parata) la gamba deve ripiegarsi molto, e la
       piega andava dalla parte in cui il ginocchio gia' puntava: sotto il
       manto, fino a 19 cm. Un ginocchio sepolto e' un arto in
       configurazione impossibile — la prima delle verifiche della giuria.
       Se il verso scelto lo manda sottoterra si prende l'altro, che e'
       l'unica altra soluzione della stessa IK: stesse ossa, stessa
       caviglia, il ginocchio dall'altra parte. */
    if(ky<PIEDE_Y){
      const ky2=by-py*hq;
      if(ky2>ky){ kx=bx-px*hq; ky=ky2; kz=bz-pz*hq; }
    }
  }
  /* il beccheggio del piede e' un ANGOLO, e anche il suo limite: la punta
     non buca il campo perche' la caviglia smette di flettersi, non perche'
     la scarpa si accorci */
  let tp=-b*0.8; if(tp>1.15)tp=1.15; else if(tp<-0.5)tp=-0.5;
  let st=Math.sin(tp);
  const smx=(fyy-PUNTA_Y)/FOOT;
  if(st>smx) st=smx<-1?-1:smx;
  const ct=Math.sqrt(1-st*st);
  setJ(hip,hx,hy,hz); setJ(kn,kx,ky,kz); setJ(ft,fxx,fyy,fzz);
  setJ(toe, fxx, fyy-FOOT*st, fzz+FOOT*ct);
}

/* --- FK braccio: a = angolo avanti dalla spalla, elb = flessione
   gomito, out = scarto laterale voluto della mano (diventa abduzione) --- */
function braccio(sh,el,ha, sx,sy,sz, a,elb, out,side){
  sy+=DPQ;                                   // la spalla segue il bacino
  /* LA MICRO-VARIAZIONE, e perche' sta QUI e non dopo. Due figure nella
     stessa clip alla stessa fase sono lo STESSO disegno, pixel per
     pixel: e' il requisito «mai due giocatori nella stessa posa» violato
     per costruzione. VARB e' un pizzico di braccio in piu' avanti da un
     lato e in meno dall'altro, estratto dal seme del NOME: entra PRIMA
     della cinematica, cosi' l'osso resta lungo uguale e la posa che ne
     esce e' comunque una posa legale. Applicata dopo, sarebbe uno
     spostamento di mano — cioe' di nuovo uno spaghetto. */
  a+=VARB*side;
  let sa2=out/UA;                            // seno dell'abduzione
  if(sa2>AB_MAX){ sa2=AB_MAX; TAGLI++; } else if(sa2<-AB_MAX){ sa2=-AB_MAX; TAGLI++; }
  /* L2 sul GOMITO, poi L3: un braccio spalancato non ha il gomito
     teso. L'abduzione qui e' un seno, e per il minimo del gomito basta
     il seno: e' monotono nell'intervallo e costa zero trigonometriche. */
  if(elb<E_MIN){ elb=E_MIN; TAGLI++; } else if(elb>E_MAX){ elb=E_MAX; TAGLI++; }
  const eMin=0.12+0.29*(sa2<0?-sa2:sa2);
  if(elb<eMin){ elb=eMin; TAGLI++; }
  const b=a+elb;
  const ca2=Math.sqrt(1-sa2*sa2);
  const ex=sx+UA*sa2*side, ey=sy-UA*ca2*Math.cos(a), ez=sz+UA*ca2*Math.sin(a);
  /* l'avambraccio rientra verso il corpo (l'abduzione cala del 45%): e'
     quello che il vecchio -0,04*side voleva dire, ma senza rubare
     lunghezza all'osso */
  const sb2=sa2*0.55, cb2=Math.sqrt(1-sb2*sb2);
  setJ(sh,sx,sy,sz); setJ(el,ex,ey,ez);
  setJ(ha, ex+FA*sb2*side, ey-FA*cb2*Math.cos(b), ez+FA*cb2*Math.sin(b));
}

/* --- tronco + testa (la testa raddrizza meta' dell'inclinazione) ---
   IL BOB DELLA TESTA E' UN CENNO, NON UN COLLO ELASTICO. Prima l'ultimo
   argomento era una quota AGGIUNTA alla y della testa: sollevava il
   cranio staccandolo dal collo, e il banco lo leggeva come un collo che
   si allunga fino al +30% (clip 'cielo'). Adesso lo stesso numero e' un
   angolo di cenno attorno al collo — la testa oscilla come oscilla la
   testa di chi corre — e la distanza collo-cranio resta 0,19 m sempre.
   Il fattore 5,26 = 1/0,19 converte la vecchia quota nell'angolo che
   sposta la testa altrettanto: le clip esistenti non cambiano numeri. */
const CENNO=1/0.25;
/* IL BUSTO SI INCLINA ANCHE DI LATO, e anche quello e' una ROTAZIONE:
   `roll` (opzionale, radianti) fa pendere la colonna verso destra. Prima
   la finta otteneva lo stesso effetto sommando metri alla x di torace,
   collo e testa — cioe' stirando la colonna del 7% — e il banco la
   trovava fuori gabbia. Un asse che pende resta lungo uguale. */
function corpo(pelvY,sway,lean,headBob,roll){
  /* la corporatura alza o abbassa il bacino — ma non quando e' a terra */
  DPQ = pelvY>0.72 ? DP : pelvY<0.42 ? 0 : DP*(pelvY-0.42)*3.3333;
  pelvY+=DPQ;
  const sl=Math.sin(lean), cl=Math.cos(lean);
  let dx=0, dk=1;
  if(roll){ dx=Math.sin(roll); dk=Math.cos(roll); }
  const ey=dk*cl, ez=dk*sl;                 // versore della colonna
  setJ(PELVIS, sway+0.06*dx, pelvY+0.06*ey, 0.06*ez);
  setJ(CHEST,  sway+0.355*dx, pelvY+0.355*ey, 0.355*ez);
  setJ(NECK,   sway+0.46*dx, pelvY+0.46*ey, 0.46*ez);
  const hl=lean*0.55+headBob*CENNO, shl=Math.sin(hl), chl=Math.cos(hl);
  let hx=0, hk=1;
  if(roll){ hx=Math.sin(roll*0.75); hk=Math.cos(roll*0.75); }
  setJ(HEAD, sway+0.46*dx+0.25*hx, pelvY+0.46*ey+0.25*hk*chl, 0.46*ez+0.25*hk*shl);
}

/* LA TESTA SI GIRA, NON SCIVOLA. Sei clip volevano «la faccia al cielo»
   o «la testa che pende» e lo ottenevano sommando metri alla y e alla z
   del cranio: il collo si allungava fino al +30% (misurato dal banco
   ?gabbia sulla clip 'cielo') o si accorciava del 27% (delusione).
   Qui la testa RUOTA attorno al collo nel piano sagittale — positivo il
   mento che scende, negativo la faccia che sale — e l'osso resta 0,19 m
   per costruzione. Da chiamare DOPO corpo(). */
function cenno(rad){
  const nx=P[NECK*3], ny=P[NECK*3+1], nz=P[NECK*3+2];
  const dy=P[HEAD*3+1]-ny, dz=P[HEAD*3+2]-nz;
  const c=Math.cos(rad), s=Math.sin(rad);
  setJ(HEAD, P[HEAD*3], ny+dy*c-dz*s, nz+dy*s+dz*c);
}

/* BRACCIO A DIREZIONI: due versori, due ossa. Serve alle pose che escono
   dal cono di abduzione di braccio() — l'aliante dell'esultanza, la V
   delle ginocchia — dove il gomito sta SOPRA la spalla e nessun
   `out` laterale saprebbe dirlo. I due vettori si danno in qualunque
   scala: qui dentro si normalizzano, quindi le ossa misurano UA e FA
   esatti comunque siano stati scritti i numeri. */
function braccioDir(sh,el,ha, sx,sy,sz, ux,uy,uz, vx,vy,vz){
  sy+=DPQ;                                   // la spalla segue il bacino
  let l=Math.sqrt(ux*ux+uy*uy+uz*uz);
  if(l<1e-6){ ux=0; uy=-1; uz=0; l=1; }
  const ex=sx+UA*ux/l, ey=sy+UA*uy/l, ez=sz+UA*uz/l;
  let m=Math.sqrt(vx*vx+vy*vy+vz*vz);
  if(m<1e-6){ vx=0; vy=-1; vz=0; m=1; }
  setJ(sh,sx,sy,sz); setJ(el,ex,ey,ez);
  setJ(ha, ex+FA*vx/m, ey+FA*vy/m, ez+FA*vz/m);
}

/* ============================================================
   POSE: curve di fase. u in [0,1) e' la fase del ciclo.
   ============================================================ */

/* locomozione generica parametrica (camminata e corsa) */
function poseLoco(u,q){
  const w=u*TAU, sw=Math.sin(w), c2=Math.cos(2*w);
  const pelvY=0.93-q.crouch+q.bounce*c2;
  const ht=q.twist*sw, st=-q.twist*1.3*sw;   // bacino e spalle in controrotazione
  corpo(pelvY,0,q.lean,q.headBob*c2);
  // spalle (sull'inclinazione del tronco, con torsione)
  const sl=Math.sin(q.lean), cl=Math.cos(q.lean);
  const shY=pelvY+0.44*cl, shZ=0.44*sl, cs=Math.cos(st), ss=Math.sin(st);
  // braccia in opposizione alle gambe
  const aAR=-q.arm*sw+q.armOfs, aAL=q.arm*sw+q.armOfs;
  const eR=q.elb0+q.elbA*(0.5-0.5*sw), eL=q.elb0+q.elbA*(0.5+0.5*sw);
  braccio(SHR,ELR,HAR,  SHW*cs, shY, shZ+SHW*ss, aAR,eR, q.armOut, 1);
  braccio(SHL,ELL,HAL, -SHW*cs, shY, shZ-SHW*ss, aAL,eL, q.armOut,-1);
  // gambe: anticipo (ginocchio raccolto in recupero), peso (bacino che
  // scende sull'appoggio), seguito (punta che spinge dietro)
  const ch=Math.cos(ht), sh=Math.sin(ht);
  const aR=q.leg*sw+q.legOfs, aL=-q.leg*sw+q.legOfs;
  const s5=Math.sin(w-q.kneeLag);
  const kR=q.knee0+q.kneeA*(0.5+0.5*s5), kL=q.knee0+q.kneeA*(0.5-0.5*s5);
  gamba(HIPR,KNR,FTR,TOR,  HIPW*ch, pelvY,  HIPW*sh, aR,kR,  q.stanceW);
  gamba(HIPL,KNL,FTL,TOL, -HIPW*ch, pelvY, -HIPW*sh, aL,kL, -q.stanceW);
}

/* =====================================================================
   LE TRE ANDATURE, riscritte sulle regole della SILHOUETTE.
   Sono le tre clip che occupano quasi tutto il quadro, quasi sempre: se
   una sagoma non si legge, si legge male qui. Le regole sono quelle con
   cui i numeri vanno SCRITTI, non un controllo dopo:
     1. angoli larghi fra gli arti — mai gambe unite su una posa che il
        fermo-immagine possa pescare;
     2. nessun arto appoggiato al busto: un braccio lungo il fianco e' un
        braccio che sparisce dentro la massa centrale;
     3. da fermo la figura ha una BASE, non sta in equilibrio su un punto.

   ATTESA. Era il difetto dei «birilli» del calcio d'inizio: leg 0,03
   (le due cosce a tre centesimi di radiante l'una dall'altra: un tubo
   solo), armOut 0,035 (abduzione 0,13 rad, le braccia incollate) e
   gomiti quasi tesi. Adesso le cosce si aprono di 0,20 rad complessivi,
   il ginocchio ha 0,12 di flessione — un uomo in attesa non ha le gambe
   dritte — e le braccia stanno a 0,28 rad di abduzione con il gomito a
   0,30: staccate dal busto, con la spalla che si vede.
   CAMMINATA e CORSA. lean sale a 0,08 e 0,28 (il busto si inclina nel
   senso del moto: e' cio' che distingue una corsa da una passeggiata in
   sagoma) e armOut porta l'abduzione a 0,20 e 0,26 rad, cosi' le
   braccia non rientrano nel torace nel punto morto della falcata.
   ===================================================================== */
const Q_FERMO={leg:0.18,legOfs:0.01,knee0:0.26,kneeA:0.04,kneeLag:3.7,
  arm:0.05,armOfs:0.24,elb0:1.28,elbA:0.04,armOut:0.200,
  lean:0.05,bounce:0.008,crouch:0.04,twist:0.02,stanceW:0.255,headBob:0.005};
/* CORSA CONTRO CAMMINATA, secondo giro: la coppia restava a 0,163 di
   distanza di Hamming su un minimo di 0,18, cioe' le due sagome erano
   ancora quasi la stessa. Le GAMBE non le separano piu' — sono gia'
   andate in direzioni opposte (la corsa alza, la camminata distende) e
   spingerle oltre le rompe entrambe. Le separano le BRACCIA: la corsa
   pompa (arm 0,78 -> 1,05, gomito 1,50 quasi chiuso: due triangoli
   compatti alti sul busto), la camminata le lascia quasi ferme e distese
   (arm 0,58 -> 0,40, gomito 0,55 -> 0,34). In nero sono due masse alte
   diverse, ed e' la meta' alta della figura a decidere la distanza. */
const Q_CAMMINATA={leg:0.52,legOfs:0.05,knee0:0.10,kneeA:0.72,kneeLag:4.2,
  arm:0.40,armOfs:0.05,elb0:0.62,elbA:0.16,armOut:0.185,
  lean:0.17,bounce:0.034,crouch:0.02,twist:0.14,stanceW:0.105,headBob:0.012};
const Q_CORSA={leg:0.60,legOfs:0.15,knee0:0.46,kneeA:1.55,kneeLag:3.6,
  arm:1.05,armOfs:0.08,elb0:1.50,elbA:0.34,armOut:0.215,
  lean:0.44,bounce:-0.055,crouch:0.05,twist:0.17,stanceW:0.075,headBob:0.010};

function poseFermo(u){ poseLoco(u,Q_FERMO); }
function poseCamminata(u){ poseLoco(u,Q_CAMMINATA); }
function poseCorsa(u){ poseLoco(u,Q_CORSA); }

/* frenata: piede piantato avanti col tacco, ma il PESO sta DIETRO —
   busto reclinato indietro, bacino arretrato sulla gamba piegata sotto;
   torsione di tre quarti del busto per la vista sagittale; e gli indizi
   che VIVONO IN PIANTA (a 0°/180° la firma sagittale sparisce):
   il passo che si ALLARGA A COMPASSO, le braccia a BILANCIERE LATERALE
   nel primo terzo (poi avanti a bilanciare), e i piedi che ARANO — i
   solchi di slittata dietro i tacchi li disegna clip.polvere.solchi */
function poseFrenata(u){
  const osc=Math.sin(u*TAU*1.8)*Math.exp(-2.5*u);
  const largo=sm(u,0.0,0.16);            // il passo si allarga a compasso
  const terzo=1-sm(u,0.26,0.44);         // il primo terzo dell'arresto
  const crouch=0.24+0.03*osc, lean=-0.38+0.10*osc;
  const pelvY=0.93-crouch;
  corpo(pelvY,0,lean,0);
  const dz=-0.09;                        // il bacino arretra dietro l'appoggio
  P[PELVIS*3+2]+=dz; P[CHEST*3+2]+=dz; P[NECK*3+2]+=dz; P[HEAD*3+2]+=dz;
  const sl=Math.sin(lean), cl=Math.cos(lean);
  const shY=pelvY+0.44*cl, shZ=0.44*sl+dz;
  const st=0.55, cs=Math.cos(st), ss=Math.sin(st);   // torsione di tre quarti
  // bilanciere: braccia basse e LARGHE all'inizio, poi avanti
  const aR2=0.12*terzo+(0.55+0.18*osc)*(1-terzo);
  const aL2=0.10*terzo+(0.40+0.14*osc)*(1-terzo);
  const eR2=0.15*terzo+1.05*(1-terzo), eL2=0.20*terzo+1.20*(1-terzo);
  const outT=0.26*terzo;
  braccio(SHR,ELR,HAR,  SHW*cs, shY, shZ+SHW*ss, aR2,eR2, 0.10+outT, 1);
  braccio(SHL,ELL,HAL, -SHW*cs, shY, shZ-SHW*ss, aL2,eL2, 0.12+outT,-1);
  const ht=-0.18, ch=Math.cos(ht), shh=Math.sin(ht); // bacino in controtorsione
  gamba(HIPR,KNR,FTR,TOR,  HIPW*ch, pelvY, dz+HIPW*shh,  0.72+0.05*osc, 0.06,  0.11+0.13*largo);
  gamba(HIPL,KNL,FTL,TOL, -HIPW*ch, pelvY, dz-HIPW*shh,  0.05, 0.95+0.08*osc, -0.14-0.13*largo);
}

/* ============================================================
   CALCI (gruppo palla): passaggio, filtrante, cross, tiro.
   Curve di fase comuni: ANTICIPO (w1, la carica con ginocchio
   raccolto e busto indietro), frustata accelerata (t*t), PESO
   (affondo del bacino sull'appoggio all'impatto), SEGUITO (w2,
   la gamba che sale oltre e il busto che accompagna),
   DEFORMAZIONE (schiacciata della palla nell'attimo d'impatto).
   ============================================================ */
function poseCalcio(u,q){
  const ti=q.tImp, t1=ti-q.swing, tF=ti+q.segue;
  const w1=sm(u,0.04,t1)*(1-sm(u,t1,ti+0.02));      // anticipo
  const w2=sm(u,t1,tF)*(1-sm(u,0.86,0.995));        // seguito
  const dd=(u-ti)/0.13, peso=Math.exp(-dd*dd);      // affondo del peso
  const pelvY=0.93-(q.crouch+q.dip*peso+0.02*w1);
  const lean=-q.leanBack*w1+q.leanFwd*w2;
  corpo(pelvY,0,lean,-0.012*peso);
  const sl=Math.sin(lean), cl=Math.cos(lean);
  const shY=pelvY+0.44*cl, shZ=0.44*sl;
  // il corpo si apre in carica e si chiude attraverso l'impatto
  const st=q.apriSp*(w1-1.1*w2), cs=Math.cos(st), ss=Math.sin(st);
  const ht=q.apriAn*(w1-0.7*w2), ch=Math.cos(ht), shh=Math.sin(ht);
  // braccia in opposizione: la sinistra accompagna, la destra bilancia
  const aR=q.arm*(0.5*w1-0.9*w2), aL=q.arm*(-0.6*w1+1.1*w2);
  const ap=q.armApri||0;
  braccio(SHR,ELR,HAR,  SHW*cs, shY, shZ+SHW*ss, aR,0.35+0.55*w1, q.armOut+ap*w1+0.05*w2, 1);
  braccio(SHL,ELL,HAL, -SHW*cs, shY, shZ-SHW*ss, aL,0.30+0.50*w2, q.armOut+ap*0.85*w2+0.04*w1,-1);
  // gamba destra calciante: carica -> frustata (t*t) -> seguito (ease-out)
  let aG,kG;
  if(u<t1){ const r=sm(u,0.04,t1); aG=-q.back*r; kG=0.25+q.kneeBack*r; }
  else if(u<ti){ const t=(u-t1)/q.swing, t2=t*t;
    aG=-q.back+(q.fwd+q.back)*t2;
    kG=(0.25+q.kneeBack)+(q.kneeImp-0.25-q.kneeBack)*t2; }
  else if(u<tF){ const t=(u-ti)/q.segue, e=1-(1-t)*(1-t);
    aG=q.fwd+(q.follow-q.fwd)*e; kG=q.kneeImp+(q.kneeSegue-q.kneeImp)*e; }
  else{ const r=sm(u,tF,0.99); aG=q.follow*(1-r); kG=q.kneeSegue+(0.25-q.kneeSegue)*r; }
  const ags=(q.aprSeg||0)*w2;            // le gambe si aprono nel seguito
  const fxR=HIPW-(q.attraversa||0)*w2+ags;   // il cross taglia attraverso il corpo
  gamba(HIPR,KNR,FTR,TOR,  HIPW*ch, pelvY,  HIPW*shh, aG,kG, fxR);
  // gamba d'appoggio piantata accanto alla palla, si piega sotto il peso
  gamba(HIPL,KNL,FTL,TOL, -HIPW*ch, pelvY, -HIPW*shh, q.appA, q.appK+0.30*peso, -0.13-ags);
}
/* palla della clip di calcio: ferma, poi il FOTOGRAMMA DI CONTATTO
   (il collo del piede la tocca e la spinge, schiacciandola) e la
   partenza BALISTICA: l'ease-out sta solo sulla componente orizzontale,
   la verticale e' parabola nel tempo (mai spaziatura uniforme in salita) */
function pallaCalcio(u,q,out){
  const ti=q.tImp, tc=ti-0.035;
  if(u<tc){ out[0]=q.px; out[1]=RPALLA; out[2]=q.pz; }
  else if(u<ti){ const c=(u-tc)/0.035;   // il contatto: toccata e spinta
    out[0]=q.px; out[1]=RPALLA*(1-0.10*c); out[2]=q.pz+0.06*c*c; }
  else{
    // VELOCITA' D'USCITA vera: ease cubico = velocita' iniziale alta
    // (3x la media) con decadimento; le gittate sono in metri veri,
    // la palla ESCE dal quadro invece di sospendersi accanto al piede
    const f=(u-ti)/(1-ti), m=1-f, e=1-m*m*m, d=q.gitt*e;
    out[0]=q.px+q.dirX*d; out[2]=q.pz+0.06+d;
    out[1]=RPALLA*0.90+q.alza*(q.arco?4*f*(1-f):e)+RPALLA*0.10*e;
  }
  const dw=Math.abs(u-ti);
  out[3]=dw<0.05?0.40*(1-dw/0.05):0;     // schiacciata sul collo del piede
}

   DUELLO: finta/dribbling, contrasto in scivolata, rovesciata.
   ============================================================ */

/* finta: doppio tocco d'interno, la palla cambia lato due volte per
   giro (cosi' la clip torna su se stessa). Curve di fase:
   ANTICIPO il peso si sposta sull'appoggio PRIMA che la palla parta;
   PESO l'affondo del bacino a ogni tocco; SEGUITO spalle e testa
   attraversano dopo il bacino e sporgono oltre. */
function poseFinta(u){
  const s1=sm(u,0.21,0.35), s2=sm(u,0.71,0.85);
  const w1=sm(u,0.15,0.31), w2=sm(u,0.65,0.81);
  const peso=-(1-2*w1+2*w2);                 // anticipo: parte prima della palla
  const g1=sm(u,0.24,0.42), g2=sm(u,0.74,0.92);
  const segue=-(1-2*g1+2*g2);                // seguito: il busto arriva dopo
  const d1=(u-0.26)/0.09, d2=(u-0.76)/0.09;
  const dip=Math.exp(-d1*d1)+Math.exp(-d2*d2);   // peso: l'affondo al tocco
  const pelvY=0.79-0.07*dip;
  const swP=0.18*peso;
  /* il busto SPORGE oltre il bacino, e lo fa PENDENDO: la colonna si
     inclina di lato invece di scorrere (0,71 m e' l'altezza bacino-testa,
     quindi lo scarto laterale voluto diviso 0,71 e' l'angolo che lo da') */
  const dLat=0.12*(segue-peso);
  corpo(pelvY,swP,0.18,0,dLat/0.71);
  const cl=Math.cos(0.18), sl=Math.sin(0.18);
  const shY=pelvY+0.44*cl, shZ=0.44*sl, shX=swP+dLat*0.6;
  braccio(SHR,ELR,HAR, shX+SHW, shY, shZ, 0.10+0.60*segue,0.55, 0.08+0.06*dip, 1);
  braccio(SHL,ELL,HAL, shX-SHW, shY, shZ, 0.10-0.60*segue,0.55, 0.08+0.06*dip,-1);
  // il piede del tocco esce sulla palla e la attraversa spingendola
  const r1=sm(u,0.13,0.23)*(1-sm(u,0.36,0.50));
  const p1=sm(u,0.20,0.34);
  const r2=sm(u,0.63,0.73)*(1-sm(u,0.86,0.99));
  const p2=sm(u,0.70,0.84);
  const fxR= 0.19+r1*(0.14-0.58*p1);
  const fxL=-0.19-r2*(0.14-0.58*p2);
  const aR=0.16+r1*0.50, aL=0.16+r2*0.50;
  const kR=0.42+0.20*dip*(1+peso), kL=0.42+0.20*dip*(1-peso);
  gamba(HIPR,KNR,FTR,TOR,  HIPW+swP*0.6, pelvY, 0.02, aR,kR, fxR);
  gamba(HIPL,KNL,FTL,TOL, -HIPW+swP*0.6, pelvY, 0.02, aL,kL, fxL);
}
function pallaFinta(u,o){
  const s1=sm(u,0.21,0.35), s2=sm(u,0.71,0.85);
  o[0]=0.30*(1-2*s1+2*s2);                   // il cambio di lato
  const tr=4*(s1*(1-s1)+s2*(1-s2));          // 1 a meta' traversata
  o[1]=RPALLA+0.05*tr; o[2]=0.32+0.08*tr;
  let dw=Math.abs(u-0.225); const dv=Math.abs(u-0.725); if(dv<dw)dw=dv;
  o[3]=dw<0.035?0.32*(1-dw/0.035):0;         // schiacciata al tocco
}

/* contrasto in scivolata: ANTICIPO l'ultimo passo caricato in corsa;
   la discesa: gamba destra tesa avanti che striscia, sinistra ripiegata
   sotto, busto indietro col braccio dietro d'appoggio; PESO la botta
   quando il bacino tocca terra; SEGUITO l'oscillata smorzata del busto
   che continua a ruotare; infine la rialzata. Due lerp in fila:
   corsa -> scivolata (giu') -> rialzata (su). */
function poseScivolata(u){
  const giu=sm(u,0.08,0.26);
  const dd=(u-0.28)/0.09, botta=Math.exp(-dd*dd);
  const su=sm(u,0.70,0.95);
  const p=u-0.28, osc=p>0?Math.sin(p*9.5)*Math.exp(-4.5*p):0;
  /* il bacino della strisciata sale da 0,30 a 0,32 e la botta affonda di
     0,03 invece di 0,04: due centimetri e mezzo comprati al ginocchio
     ripiegato sotto, che con le gambe lunghe dello spilungone finiva a
     -0,052 m sotto il manto — oltre il fondo ammesso dal banco. La posa
     e' la stessa; il ginocchio adesso sta sul campo anche per lui. */
  /* IL BUSTO NON SI SDRAIA: SI PUNTELLA. A -0,95 rad la colonna era gia'
     a 54 gradi dal filo a piombo e le spalle arrivavano a 56 cm da terra:
     riempita di nero la figura leggeva «caduto». Una scivolata vera e' un
     TRIANGOLO — il piede teso avanti, il bacino a terra, il busto tirato
     su dal braccio d'appoggio dietro: -0,66 rad porta le spalle a 65 cm e
     l'ipotenusa dal tacco alla testa diventa una diagonale sola. */
  const pelvY=(0.80+(0.32-0.80)*giu)+(0.62-0.32)*su-0.03*botta;
  const lean=(0.30+(-0.66-0.30)*giu)+(0.18+0.66)*su+0.11*osc-0.07*botta;
  corpo(pelvY,0,lean,0);
  const sl=Math.sin(lean), cl=Math.cos(lean);
  const shY=pelvY+0.44*cl, shZ=0.44*sl;
  const aBR=(-0.45+(-0.55+0.45)*giu)+(-0.30+0.55)*su+0.20*osc;
  const aBL=( 0.50+( 1.15-0.50)*giu)+( 0.25-1.15)*su-0.15*osc;
  braccio(SHR,ELR,HAR,  SHW, shY, shZ, aBR,0.30, 0.06+0.10*giu-0.08*su, 1);
  braccio(SHL,ELL,HAL, -SHW, shY, shZ, aBL,0.45, 0.06+0.06*giu,-1);
  /* la gamba che contrasta si TENDE del tutto (0,10 -> 0,04 di flessione)
     e le due gambe si aprono di lato (0,10/-0,15 -> 0,26/-0,26): il
     triangolo ha bisogno di due lati, non di un tubo solo */
  const aR=(0.55+(1.42-0.55)*giu)+(0.20-1.42)*su+0.05*osc;
  const kR=(0.40+(0.04-0.40)*giu)+(0.60-0.04)*su;
  const aL=(-0.45+(-0.80+0.45)*giu)+(-0.10+0.80)*su;
  const kL=(0.90+(1.15-0.90)*giu)+(0.70-1.15)*su;
  gamba(HIPR,KNR,FTR,TOR,  HIPW, pelvY, 0, aR,kR,  0.10+0.16*giu);
  gamba(HIPL,KNL,FTL,TOL, -HIPW, pelvY, 0, aL,kL, -0.15-0.11*giu);
}

/* ROVESCIATA: carica (ANTICIPO: crouch e braccia indietro), stacco,
   e nel clou l'ARCO ORIZZONTALE: la schiena si stende quasi parallela
   al terreno mentre la FORBICE scambia le gambe (la sinistra sale per
   prima e scende mentre la destra frusta accelerata t*t sopra il petto
   fino alla palla alta); in volo le braccia si SPALANCANO (dall'alto
   la figura dice "e' in aria" e l'ombra, guidata dalla quota dei
   giunti, si stacca e rimpicciolisce). Poi la discesa di schiena,
   l'IMPATTO (botta + polvere), mezzo secondo disteso a terra con
   l'oscillata smorzata, e la RIALZATA IN TRE TEMPI: seduto (il busto
   su, le mani puntate dietro), raccolto (il piede sotto, il bacino
   su), in piedi. Tutte le curve tornano al valore di partenza.
   CRITERIO D'USO: in partita la rovesciata si vede soprattutto in
   CAMERA BASSA (riprese del gol): quella vista e' la principale.
   Alla pianta bastano gli indizi di quota e rotazione: l'ombra
   NETTAMENTE staccata (fattore quadratico sulle quote alte), l'arco
   di scia dietro il piede che frusta (clip.scia) e la palla SOPRA la
   figura, piu' grande perche' vicina alla camera alta (PRF). */
function poseRovesciata(u){
  const ca=sm(u,0.02,0.14);              // carica
  const st=sm(u,0.14,0.26);              // stacco
  const vol=sm(u,0.18,0.40);             // la schiena si stende in aria
  const dis=sm(u,0.46,0.575);            // discesa di schiena
  const dd=(u-0.44)/0.05, imp=Math.exp(-dd*dd);      // l'attimo del colpo
  const db=(u-0.575)/0.045, botta=Math.exp(-db*db);  // la botta a terra
  const p=u-0.575, osc=p>0?Math.sin(p*11)*Math.exp(-6*p):0;
  const sed=sm(u,0.70,0.80);             // 1° tempo: seduto
  const rac=sm(u,0.79,0.885);            // 2° tempo: raccolto sul piede
  const alz=sm(u,0.875,0.975);           // 3° tempo: in piedi
  const pelvY=0.93-0.30*ca+0.46*st-0.90*dis+0.06*sed+0.33*rac+0.35*alz
              -0.05*botta+0.02*osc;
  const lean=0.06-0.14*ca-1.58*vol+2.02*sed-0.12*rac-0.18*alz
             +0.10*imp-0.06*botta+0.10*osc;
  corpo(pelvY,0,lean,0);
  const sl=Math.sin(lean), cl=Math.cos(lean);
  const shY=pelvY+0.44*cl, shZ=0.44*sl;
  // braccia: indietro in carica, SPALANCATE in volo, lunghe a terra
  // oltre la testa, poi puntate dietro a lanciare la rialzata
  const aBR=-0.10-0.85*ca+2.30*vol-2.92*dis+0.37*sed+1.55*rac-0.45*alz+0.20*osc;
  /* la sinistra va DIETRO piu' della destra nella discesa: con la
     scatola degli angoli che tiene il gomito non teso, a -0,20 la mano
     finiva 5,3 cm sotto il manto (misurato dal banco), cioe' sepolta
     invece che appoggiata. Piu' il braccio arretra, meno il coseno
     spinge la mano in giu': a -0,32 la mano si appoggia. */
  const aBL=aBR+0.20*vol-0.32*dis;
  const eB=0.30+0.10*ca-0.20*vol+0.35*sed-0.15*rac-0.10*alz;
  const out=0.06+0.26*vol-0.24*dis+0.02*rac-0.04*alz;
  braccio(SHR,ELR,HAR,  SHW, shY, shZ, aBR,eB, out, 1);
  braccio(SHL,ELL,HAL, -SHW, shY, shZ, aBL,eB, out,-1);
  const hz=0.06*sl;
  // destra calciante: carica, frustata accelerata (t*t) sopra il petto,
  // seguito, discesa distesa, poi i tre tempi della rialzata
  let t=(u-0.30)/0.14; if(t<0)t=0; else if(t>1)t=1;
  const fr=t*t, sg=sm(u,0.44,0.52), dn=sm(u,0.48,0.62);
  const aG=0.15-0.70*ca-0.05*st+3.05*fr+0.30*sg-1.40*dn-0.20*sed-0.80*rac-0.20*alz;
  const kG=0.40+0.55*ca+3.40*t*(1-t)-0.75*fr+0.95*sed-0.10*rac-0.65*alz+0.15*botta;
  // sinistra: sale per prima, scende in forbice quasi orizzontale,
  // si distende a terra, poi si pianta per la rialzata
  const su1=sm(u,0.14,0.28), giu1=sm(u,0.30,0.46);
  const aS=0.30-0.45*ca+2.10*su1-0.90*giu1+0.40*dn-0.30*sed-0.75*rac-0.10*alz;
  const kS=0.45+0.45*ca+0.35*su1-0.55*giu1-0.10*dn+1.05*sed-0.25*rac-0.95*alz+0.15*botta;
  gamba(HIPR,KNR,FTR,TOR,  HIPW, pelvY, hz, aG,kG,  HIPW);
  gamba(HIPL,KNL,FTL,TOL, -HIPW, pelvY, hz, aS,kS, -HIPW);
}
/* palla della rovesciata: il cross scende dall'alto in CADUTA VERA
   (y accelerata), l'impatto sul collo del piede sopra il petto (con la
   schiacciata), poi la parabola balistica all'indietro: verticale
   quadratica nel tempo, ease-out della sola componente orizzontale */
function pallaRovesciata(u,o){
  const ti=0.44;
  if(u<ti){ const f=u/ti;
    o[0]=0.26-0.155*f; o[1]=1.86+0.80*(1-f*f); o[2]=1.85-1.19*f;
  }else{ const f=(u-ti)/(1-ti), e=1-(1-f)*(1-f);
    o[0]=0.105-0.06*e; o[2]=0.66-2.75*e;
    let y=1.86+1.60*f-3.60*f*f; if(y<RPALLA)y=RPALLA; o[1]=y;
  }
  const dw=Math.abs(u-ti);
  o[3]=dw<0.04?0.45*(1-dw/0.04):0;
}

/* ============================================================
   PORTIERE: parata bassa, tuffo laterale, presa alta, rinvio.
   Le clip vivono nel piano sagittale (come la rovesciata): e' lo
   yaw della figura a dare il tuffo "laterale" visto dalla porta.
   ============================================================ */

/* PARATA BASSA: ANTICIPO la molla (il corpo si carica e scende
   PRIMA che la palla arrivi), la discesa sul ginocchio con le mani
   che scendono al suolo davanti, PESO la botta all'impatto che
   affonda spalle e testa, SEGUITO l'oscillata smorzata delle
   braccia che accompagnano la respinta, poi la rialzata.
   Tutte le curve tornano al valore di partenza: giro senza scatti. */
function poseParata(u){
  const mol=sm(u,0.02,0.16);             // la molla d'anticipo
  const giu=sm(u,0.16,0.36);             // discesa sul ginocchio
  const su=sm(u,0.60,0.88);              // rialzata
  const dd=(u-0.42)/0.055, imp=Math.exp(-dd*dd);       // la botta
  const p=u-0.42, osc=p>0?Math.sin(p*10)*Math.exp(-5.5*p):0;
  const pelvY=0.86-0.08*mol-0.34*giu+0.42*su-0.025*imp;
  const lean=0.14+0.12*mol+0.52*giu-0.64*su+0.09*imp+0.05*osc;
  corpo(pelvY,0,lean,-0.01*imp);
  const sl=Math.sin(lean), cl=Math.cos(lean);
  const shY=pelvY+0.44*cl, shZ=0.44*sl;
  const aB=0.55+0.10*mol-0.28*giu+0.18*su+0.12*imp+0.14*osc;
  const eB=0.55-0.10*mol-0.45*giu+0.55*su+0.10*imp;
  const outB=0.10+0.05*giu-0.05*su;
  braccio(SHR,ELR,HAR,  SHW, shY, shZ, aB,eB, outB, 1);
  braccio(SHL,ELL,HAL, -SHW, shY, shZ, aB+0.06*osc,eB, outB,-1);
  // destra: passo largo di copertura; sinistra: il ginocchio a terra
  const aR=0.18+0.37*giu-0.37*su, kR=0.35+0.55*giu-0.55*su;
  const aL=0.18-0.53*giu+0.53*su, kL=0.35+1.60*giu-1.60*su;
  gamba(HIPR,KNR,FTR,TOR,  HIPW, pelvY, 0, aR,kR,  0.12+0.22*giu-0.22*su);
  gamba(HIPL,KNL,FTL,TOL, -HIPW, pelvY, 0, aL,kL, -0.12-0.04*giu+0.04*su);
}
/* palla della parata: arriva rasoterra veloce, la schiacciata sulle
   mani, e la respinta che torna via con un saltello smorzato */
function pallaParata(u,o){
  const ti=0.42;
  if(u<ti){ const f=u/ti;
    o[0]=0; o[1]=0.13; o[2]=2.60-1.98*f;
  }else{ const f=(u-ti)/(1-ti), e=1-(1-f)*(1-f);
    o[0]=0.15*e; o[2]=0.62+1.45*e;
    o[1]=RPALLA+0.30*4*f*(1-f)*(1-0.5*f);
  }
  const dw=Math.abs(u-ti);
  o[3]=dw<0.04?0.42*(1-dw/0.04):0;
}

/* TUFFO LATERALE: la sequenza VERA del volo. ANTICIPO il caricamento
   sulle gambe (crouch, braccia indietro), la SPINTA con la distensione
   completa — il bacino SALE e i piedi LASCIANO il terreno — il VOLO
   con la quota vera dei giunti (l'ombra si stacca e rimpicciolisce da
   sola, guidata dal giunto piu' basso), la deviazione all'apice,
   l'ATTERRAGGIO sul fianco con la botta (PESO), lo SCIVOLAMENTO in
   avanti con la polvere, e la rialzata col piede raccolto sotto. */
function poseTuffo(u){
  const ca=sm(u,0.02,0.13);              // caricamento sulle gambe
  const sp=sm(u,0.13,0.21);              // SPINTA: il bacino sale
  const est=sm(u,0.13,0.30);             // le gambe si distendono dietro
  const vol=sm(u,0.17,0.34);             // volo: il busto si stende
  const cad=sm(u,0.44,0.58);             // discesa fino al fianco
  const ri=sm(u,0.74,0.96);              // rialzata
  const rac=sm(u,0.72,0.84)*(1-sm(u,0.86,0.98));   // il piede sotto
  const dd=(u-0.40)/0.05, imp=Math.exp(-dd*dd);    // deviazione all'apice
  const db=(u-0.58)/0.05, botta=Math.exp(-db*db);  // la botta a terra
  const p=u-0.58, osc=p>0?Math.sin(p*9)*Math.exp(-5*p):0;  // assestamento
  const slitta=sm(u,0.56,0.72)*(1-sm(u,0.80,0.97));        // scivolamento
  const pelvY=0.88-0.30*ca+0.47*sp-0.78*cad+0.61*ri-0.04*botta+0.02*osc;
  const lean=0.12+0.18*ca+1.36*vol+0.05*imp-1.54*ri+0.10*osc;
  corpo(pelvY,0,lean,0);
  const sl=Math.sin(lean), cl=Math.cos(lean);
  const shY=pelvY+0.44*cl, shZ=0.44*sl;
  // braccia: indietro in carica, lanciate in linea col busto nel volo
  const aBR=0.45-1.05*ca+2.55*vol+0.12*imp-0.55*cad-0.95*ri+0.15*osc;
  const aBL=aBR-0.22*vol+0.22*ri;
  const eB=0.45+0.40*ca-0.75*vol+0.55*cad-0.20*ri;
  const outB=0.06+0.15*vol-0.15*ri;
  braccio(SHR,ELR,HAR,  SHW, shY, shZ, aBR,eB, outB, 1);
  braccio(SHL,ELL,HAL, -SHW, shY, shZ, aBL,eB, outB,-1);
  // gambe: piegate in carica, DISTESE DIETRO in volo (via da terra),
  // raccolte sotto per la rialzata
  const hz=0.06*sl;
  /* LE GAMBE IN VOLO STANNO IN LINEA COL BUSTO, e non e' un ritocco: e'
     il verbo. Con -1,60 la coscia arrivava a -1,05 rad, cioe' 60 gradi
     dal filo a piombo: i piedi PENZOLAVANO sotto il bacino e la scatola
     della sagoma leggeva 1,06 di larghezza su altezza — un uomo che
     cade, non uno che vola. A -2,10 la coscia va a -1,55, orizzontale
     all'indietro, e la figura diventa la barra che il tuffo deve essere
     (il banco chiede sopra 1,15). Il termine di caduta sale da 0,35 a
     0,85 cosi' l'atterraggio sul fianco resta dov'era.
     E LE DUE GAMBE SI SEPARANO IN VOLO (fx da 0,105 a 0,30): in maschera
     nera due gambe sovrapposte sono una gamba sola, e il banco conta le
     righe con due tratti distinti. */
  const apG=HIPW+0.20*vol;
  const aR=0.22+0.33*ca-2.10*est+0.85*cad+0.35*rac+0.92*ri;
  const aL=aR+0.30*vol-0.30*ri;
  const kR=0.40+1.15*ca-1.45*est+0.15*cad+0.90*rac+0.15*ri+0.20*botta;
  const kL=kR+0.15*cad-0.15*ri;
  gamba(HIPR,KNR,FTR,TOR,  HIPW, pelvY, hz, aR,kR,  apG);
  gamba(HIPL,KNL,FTL,TOL, -HIPW, pelvY, hz, aL,kL, -apG);
  // lo scivolamento sul fianco: tutto il corpo avanza, poi rientra
  if(slitta>0){ const dz2=0.34*slitta; for(let j=0;j<NJ;j++) P[j*3+2]+=dz2; }
}
/* palla del tuffo: il tiro arriva a mezza altezza, la schiacciata sui
   pugni all'apice, la deviazione con velocita' d'uscita alta che
   RICADE con la gravita' vera, rimbalza corta e rotola FUORI dal quadro */
function pallaTuffo(u,o){
  const ti=0.40;
  if(u<ti){ const f=u/ti;
    o[0]=0; o[1]=1.34-0.04*f; o[2]=3.00-2.05*f;   // arriva SUI PUGNI (y~1.38)
  }else{ const f=(u-ti)/(1-ti), m=1-f, e=1-m*m*m;
    o[0]=0.90*e; o[2]=0.95+3.60*e;
    let y=1.30+0.50*f-5.0*f*f;      // parabola vera nel tempo
    if(y<RPALLA){ const g=(f-0.54)*4.3;   // rimbalzo corto, poi rotola
      y=RPALLA+(g>0&&g<1?0.50*g*(1-g):0); }
    o[1]=y;
  }
  const dw=Math.abs(u-ti);
  o[3]=dw<0.04?0.42*(1-dw/0.04):0;
}

/* PRESA ALTA: ANTICIPO il caricamento a molla delle gambe mentre le
   braccia partono gia' verso l'alto, il salto, la presa sopra la testa
   (DEFORMAZIONE: la stretta schiaccia la palla), la discesa con la
   palla RITIRATA al petto (SEGUITO: le mani arrivano dopo il bacino),
   l'atterraggio con l'affondo sulle ginocchia (PESO), il rientro. */
function posePresa(u){
  const dip=sm(u,0.04,0.18);             // molla d'anticipo
  const salto=sm(u,0.18,0.30);           // stacco
  const alza=sm(u,0.16,0.32);            // braccia in cielo
  const disc=sm(u,0.46,0.60);            // discesa
  const ritira=sm(u,0.50,0.66);          // la palla al petto
  const fine=sm(u,0.80,0.97);            // rientro
  const dd=(u-0.61)/0.05, att=Math.exp(-dd*dd);   // il peso dell'atterraggio
  const dc=(u-0.42)/0.045, pres=Math.exp(-dc*dc); // la stretta della presa
  const pelvY=0.90-0.16*dip+0.44*salto-0.44*disc+0.16*fine-0.09*att;
  const lean=0.10-0.16*alza+0.12*ritira+0.04*fine+0.05*att;
  corpo(pelvY,0,lean,-0.008*att);
  const sl=Math.sin(lean), cl=Math.cos(lean);
  const shY=pelvY+0.44*cl, shZ=0.44*sl;
  const aB=0.35-0.50*dip+2.75*alza-1.90*ritira-0.35*fine;
  const eB=0.35-0.15*alza+1.00*ritira-0.85*fine+0.15*pres;
  const outB=0.055-0.04*alza+0.04*ritira;
  braccio(SHR,ELR,HAR,  SHW, shY, shZ, aB,eB, outB, 1);
  braccio(SHL,ELL,HAL, -SHW, shY, shZ, aB,eB, outB,-1);
  const kG=0.40+0.45*dip-0.30*salto+0.35*disc+0.65*att-0.50*fine;
  const aR=0.16+0.10*salto-0.10*fine, aL=0.16-0.06*salto+0.06*fine;
  gamba(HIPR,KNR,FTR,TOR,  HIPW, pelvY, 0, aR,kG,  0.11);
  gamba(HIPL,KNL,FTL,TOL, -HIPW, pelvY, 0, aL,kG+0.10*salto-0.10*fine, -0.11);
}
/* palla della presa: il pallonetto scende dall'alto nelle mani sopra
   la testa, poi segue le mani fino al petto e ci resta */
function pallaPresa(u,o){
  const tc=0.42;
  if(u<tc){ const f=u/tc;
    o[0]=0; o[2]=2.50-2.26*f; o[1]=1.58+2.10*f-1.52*f*f;
  }else{
    const disc=sm(u,0.46,0.60), r=sm(u,0.50,0.66), g=sm(u,0.80,0.97);
    const dd=(u-0.61)/0.05, att=Math.exp(-dd*dd);
    o[0]=0; o[2]=0.24+0.06*r+0.04*g;
    o[1]=2.16-0.40*disc-0.53*r-0.07*att+0.05*g;
  }
  const dw=Math.abs(u-tc);
  o[3]=dw<0.035?0.30*(1-dw/0.035):0;
}

/* RINVIO al volo dalle mani: la palla e' TENUTA davanti, ANTICIPO il
   busto che si carica indietro mentre le mani la mollano, la caduta
   libera della palla, frustata accelerata t*t della gamba destra,
   PESO l'affondo sull'appoggio, DEFORMAZIONE la schiacciata al volo,
   SEGUITO la gamba altissima e le braccia aperte a bilanciare. */
function poseRinvio(u){
  const ti=0.48, t1=0.30;
  const w1=sm(u,0.04,t1)*(1-sm(u,t1,ti+0.02));       // anticipo
  const w2=sm(u,t1,0.70)*(1-sm(u,0.84,0.99));        // seguito
  const dd=(u-ti)/0.10, peso=Math.exp(-dd*dd);
  const molla=sm(u,0.26,0.34);                       // le mani mollano
  const rip=sm(u,0.86,0.98);                         // e tornano a reggere
  const hold=1-molla+rip;
  const pelvY=0.90-0.05*w1-0.06*peso-0.02*w2;
  const lean=0.10-0.22*w1+0.30*w2;
  corpo(pelvY,0,lean,-0.012*peso);
  const sl=Math.sin(lean), cl=Math.cos(lean);
  const shY=pelvY+0.44*cl, shZ=0.44*sl;
  const aR=0.95*hold+(0.25-0.85*w2)*(1-hold);
  const aL=0.95*hold+(0.55+0.55*w2)*(1-hold);
  const eB=0.62*hold+0.30*(1-hold);
  const outB=0.02*hold+(0.12+0.05*w2)*(1-hold);
  braccio(SHR,ELR,HAR,  SHW, shY, shZ, aR,eB, outB, 1);
  braccio(SHL,ELL,HAL, -SHW, shY, shZ, aL,eB, outB,-1);
  // destra calciante: carica -> frustata (t*t) -> seguito -> rientro
  let aG,kG;
  if(u<t1){ const r=sm(u,0.08,t1); aG=0.15-1.00*r; kG=0.30+1.05*r; }
  else if(u<ti){ const t=(u-t1)/(ti-t1), t2=t*t;
    aG=-0.85+1.90*t2; kG=1.35-1.15*t2; }
  else if(u<0.72){ const t=(u-ti)/0.24, e=1-(1-t)*(1-t);
    aG=1.05+0.65*e; kG=0.20+0.15*e; }
  else{ const r=sm(u,0.72,0.96); aG=1.70-1.55*r; kG=0.35-0.05*r; }
  gamba(HIPR,KNR,FTR,TOR,  HIPW, pelvY, 0, aG,kG,  HIPW);
  gamba(HIPL,KNL,FTL,TOL, -HIPW, pelvY, 0, 0.10-0.10*w1, 0.25+0.35*peso, -0.13);
}
/* palla del rinvio: ferma nelle mani, la caduta libera, la schiacciata
   sul collo del piede, il volo lungo e alto verso il campo */
function pallaRinvio(u,o){
  const ti=0.48;
  if(u<0.28){ const c=sm(u,0.04,0.26);
    o[0]=0; o[1]=1.18+0.02*c; o[2]=0.50-0.06*c;
  }else if(u<ti){ const f=(u-0.28)/(ti-0.28);
    o[0]=0; o[1]=1.20-0.77*f*f; o[2]=0.44+0.26*f;
  }else{ const f=(u-ti)/(1-ti), e=1-(1-f)*(1-f);
    o[0]=0; o[2]=0.70+3.40*e;
    o[1]=0.43+4.40*f-3.60*f*f;   // parabola vera nel tempo, non nell'ease
  }
  const dw=Math.abs(u-ti);
  o[3]=dw<0.05?0.45*(1-dw/0.05):0;
}

/* =====================================================================
   ATTESA DEL PORTIERE — la sagoma riservata al ruolo.
   E' il «portiere riconoscibile a colpo d'occhio» risolto in SILHOUETTE
   e non in colore: gli altri dieci in attesa stanno in piedi, stretti,
   con le braccia lungo il corpo; il portiere e' accucciato (bacino a
   0,80 invece di 0,93), i piedi larghissimi (±0,40 m, cioe' quasi due
   teste di base) e le braccia FUORI a gomiti piegati. Riempita di nero
   e' l'unica figura del campo con quel profilo a tenda, e nessun
   compagno gliela puo' rubare perche' la clip la sceglie il RUOLO.
   Il dondolio lento (mezza frequenza) sposta il peso da un piede
   all'altro: da fermo non e' una statua, ma non e' nemmeno un ciclo di
   passo — un portiere in attesa non cammina sul posto.
   Le braccia: out = UA·sin(ab), quindi 0,212 m e' un'abduzione di 0,95
   rad, il valore chiesto dal foglio. Il gomito a 0,62 tiene le mani
   avanti e lontane dal busto: l'arto esce dalla sagoma del torso per
   piu' del 60% della sua lunghezza, che e' la regola con cui una
   silhouette resta leggibile a 40 px.
   ===================================================================== */
function poseAttesaGK(u){
  const w=u*TAU, sw=Math.sin(w), c2=Math.cos(2*w);
  const dond=Math.sin(w*0.5);              // il peso passa da un piede all'altro
  /* PIU' BASSO E PIU' LARGO. A 0,80 di bacino e ±0,40 di piedi il
     portiere in maschera nera era il gemello di «sta fermo»: la coppia
     piu' vicina del banco. A 0,72 e ±0,52 il profilo diventa la TENDA
     che il ruolo promette — e ±0,52 resta dentro la gabbia dell'anca
     (sin 0,456 contro il tetto 0,751), quindi zero tagli. */
  const pelvY=0.72+0.014*c2;
  corpo(pelvY, 0.035*dond, 0.16, 0.006*c2);
  const sl=Math.sin(0.16), cl=Math.cos(0.16);
  const shY=pelvY+0.44*cl, shZ=0.44*sl;
  /* 0,200: l'abduzione entra come SENO diviso UA, e con le braccia
     corte del piccoletto 0,212 sfondava il tetto della scatola (0,8674 =
     sin 1,05). Una posa che vive dentro la gabbia e' una posa che nessun
     clamp deve riscrivere sessanta volte al secondo. */
  const ab=0.225+0.008*sw;
  braccio(SHR,ELR,HAR,  SHW, shY, shZ, 0.30+0.06*sw, 0.62, ab, 1);
  braccio(SHL,ELL,HAL, -SHW, shY, shZ, 0.30-0.06*sw, 0.62, ab,-1);
  /* la BASE: i piedi vanno dove li vuole la posa, e il ginocchio si
     piega quanto serve per arrivarci (e' la IK a due leve di gamba(),
     non un piede alzato di forza) */
  gamba(HIPR,KNR,FTR,TOR,  HIPW, pelvY, 0, 0.14, 0.75,  0.52+0.025*dond);
  gamba(HIPL,KNL,FTL,TOL, -HIPW, pelvY, 0, 0.14, 0.75, -0.52+0.025*dond);
}

/* ============================================================
   FESTA: esultanza di corsa a braccia larghe, scivolata sulle
   ginocchia, pugno al cielo; e la delusione di chi subisce.
   Nessuna palla: il gol e' gia' successo.
   ============================================================ */

/* ESULTANZA DI CORSA: la corsa continua ma il petto si apre, la
   faccia va al cielo e le braccia si spalancano ad aliante.
   SEGUITO: il rollio alternato delle ali sul passo (l'ala del lato
   d'appoggio scende); PESO: il rimbalzo della falcata (bounce). */
/* stanceW 0,08 -> 0,17: a gambe unite le due cosce, dall'alto e da
   vicino, erano UN BLOCCO SOLO di tinta squadra dal bacino alle scarpe —
   il «monolite» del primo piano. Diciassette centimetri di base bastano
   perche' fra le gambe passi l'erba. */
const Q_ESULT={leg:0.58,legOfs:0.08,knee0:0.26,kneeA:0.80,kneeLag:3.6,
  arm:0,armOfs:0,elb0:0.2,elbA:0,armOut:0.05,
  lean:-0.09,bounce:-0.030,crouch:0.04,twist:0.05,stanceW:0.24,headBob:0.006};
function poseEsultanza(u){
  poseLoco(u,Q_ESULT);
  const w=u*TAU, sw=Math.sin(w), c2=Math.cos(2*w);
  const pelvY=0.93-Q_ESULT.crouch+Q_ESULT.bounce*c2;
  const sl=Math.sin(Q_ESULT.lean), cl=Math.cos(Q_ESULT.lean);
  const shY=pelvY+0.44*cl, shZ=0.44*sl;
  cenno(-0.28);                             // la faccia al cielo
  const roll=0.17*sw;                       // il rollio delle ali (seguito)
  for(let s=-1;s<=1;s+=2){
    const sh=s>0?SHR:SHL, el=s>0?ELR:ELL, ha=s>0?HAR:HAL;
    const lift=0.12+roll*s;
    /* l'ALIANTE: le due ali quasi orizzontali, con il rollio del passo.
       Fuori dal cono di braccio() (il gomito sta all'altezza della
       spalla), quindi a direzioni — e le ossa restano lunghe uguali */
    braccioDir(sh,el,ha, s*SHW, shY, shZ,
               s*0.82, lift+0.20, 0.074,
               s*0.78, lift+0.34, 0.040);
  }
}

/* SCIVOLATA SULLE GINOCCHIA: l'arrivo accucciato di corsa e'
   l'ANTICIPO, la caduta sulle ginocchia da' la botta (PESO) con
   l'oscillata smorzata che la segue, la scivolata inarca la schiena
   e spalanca le braccia al cielo (SEGUITO: le ali si assestano dopo
   il busto, sull'onda della botta), poi il passo destro avanti e la
   rialzata. Tutte le curve tornano al valore d'inizio: giro pulito. */
function poseGinocchia(u){
  const giu=sm(u,0.06,0.20);               // la caduta sulle ginocchia
  const dd=(u-0.22)/0.07, botta=Math.exp(-dd*dd);
  const p=u-0.22, osc=p>0?Math.sin(p*9)*Math.exp(-4.5*p):0;
  const arco=sm(u,0.16,0.40);              // la schiena si inarca
  const ali=sm(u,0.12,0.34)*(1-sm(u,0.58,0.82));  // le braccia spalancate
  const passo=sm(u,0.60,0.74);             // il piede destro si pianta avanti
  const su=sm(u,0.70,0.92);                // la rialzata
  const pelvY=0.78-0.28*giu+0.28*su-0.045*botta;
  const lean=0.22-0.62*arco+0.62*su+0.10*botta+0.08*osc;
  corpo(pelvY,0,lean,0);
  cenno(-0.37*ali);                        // la faccia al cielo nell'arco
  const sl=Math.sin(lean), cl=Math.cos(lean);
  const shY=pelvY+0.44*cl, shZ=0.44*sl;
  // braccia d'arrivo in falcata opposta (anticipo di corsa), poi neutre
  const aNR=-0.45+0.60*giu-0.60*su, aNL=0.55-0.40*giu+0.40*su;
  const eN=0.55-0.20*giu+0.20*su;
  braccio(SHR,ELR,HAR,  SHW, shY, shZ, aNR,eN, 0.06, 1);
  braccio(SHL,ELL,HAL, -SHW, shY, shZ, aNL,eN, 0.06,-1);
  if(ali>0){
    /* verso la V spalancata. Prima si interpolavano le POSIZIONI di
       gomito e mano: a meta' strada le ossa perdevano fino al 68% della
       loro lunghezza (misurato). Adesso si interpolano le DIREZIONI e le
       si ridanno a braccioDir, che rinormalizza: a meta' strada le ossa
       sono ancora lunghe quanto sono. */
    const wy=0.10*osc;
    for(let s=-1;s<=1;s+=2){
      const sh=s>0?SHR:SHL, el=s>0?ELR:ELL, ha=s>0?HAR:HAL;
      const sx=s*SHW;
      /* shY+DPQ e non shY: la spalla e' gia' stata scritta con lo scarto
         di corporatura, e leggere la direzione dell'osso senza toglierlo
         la storcerebbe fino al 20% sui corpi piu' alti */
      const ux=P[el*3]-sx, uy=P[el*3+1]-(shY+DPQ), uz=P[el*3+2]-shZ;
      const vx=P[ha*3]-P[el*3], vy=P[ha*3+1]-P[el*3+1], vz=P[ha*3+2]-P[el*3+2];
      const tux=s*0.80*UA, tuy=UA*(0.55+wy), tuz=-0.05;
      const tvx=s*0.70*FA, tvy=FA*(0.66+wy), tvz=-0.06;
      braccioDir(sh,el,ha, sx,shY,shZ,
        ux+(tux-ux)*ali, uy+(tuy-uy)*ali, uz+(tuz-uz)*ali,
        vx+(tvx-vx)*ali, vy+(tvy-vy)*ali, vz+(tvz-vz)*ali);
    }
  }
  const aR=0.30-0.35*giu+0.80*passo-0.45*su;
  const kR=0.55+1.40*giu-0.95*passo-0.45*su+0.20*botta;
  const aL=0.10-0.15*giu+0.15*su;
  const kL=0.55+1.45*giu-1.45*su+0.20*botta;
  gamba(HIPR,KNR,FTR,TOR,  HIPW, pelvY, 0, aR,kR,  0.10);
  gamba(HIPL,KNL,FTL,TOL, -HIPW, pelvY, 0, aL,kL, -0.12);
}

/* PUGNO AL CIELO: ANTICIPO la carica accucciata col pugno armato
   dietro, l'esplosione accelerata (t*t) col saltello, il pugno che
   OLTREPASSA la verticale e si assesta con l'oscillata smorzata
   (SEGUITO), PESO l'affondo sulle ginocchia all'atterraggio, la
   faccia che segue il pugno, infine il braccio che torna giu'. */
function posePugno(u){
  const ca=sm(u,0.04,0.20);                // la carica
  let t=(u-0.20)/0.12; if(t<0)t=0; else if(t>1)t=1;
  const fr=t*t;                            // l'esplosione, accelerata
  const cad=sm(u,0.34,0.50);               // la ricaduta
  const dd=(u-0.50)/0.06, att=Math.exp(-dd*dd);   // il peso dell'atterraggio
  const p=u-0.32, osc=p>0?Math.sin(p*10)*Math.exp(-4.5*p):0;  // l'overshoot del pugno
  const giu2=sm(u,0.66,0.88);              // il braccio torna giu'
  const pelvY=0.90-0.22*ca+0.48*fr-0.26*cad-0.055*att;
  const lean=0.08+0.20*ca-0.37*fr+0.17*cad+0.04*att;
  corpo(pelvY,0,lean,0);
  const hold=fr-giu2;
  cenno(-0.29*hold);                       // la faccia segue il pugno
  const sl=Math.sin(lean), cl=Math.cos(lean);
  const shY=pelvY+0.44*cl, shZ=0.44*sl;
  const aR=0.12-0.62*ca+3.62*fr-3.00*giu2+0.16*osc;
  const eR=0.30+1.55*ca-1.72*fr+0.17*giu2;
  const aL=0.12-0.55*ca+0.35*fr+0.20*giu2;   // la sinistra resta bassa, in contrasto
  const eL=0.35+0.75*ca-0.35*fr-0.40*giu2;
  braccio(SHR,ELR,HAR,  SHW, shY, shZ, aR,eR, 0.055+0.055*fr-0.055*giu2, 1);
  braccio(SHL,ELL,HAL, -SHW, shY, shZ, aL,eL, 0.09,-1);
  const kG=0.32+0.88*ca-1.20*fr+0.32*cad+0.55*att;
  const aRl=0.14+0.12*ca-0.26*fr+0.14*cad;
  const aLl=0.10-0.12*ca+0.10*fr+0.02*cad;
  gamba(HIPR,KNR,FTR,TOR,  HIPW, pelvY, 0, aRl,kG,  0.11);
  gamba(HIPL,KNL,FTL,TOL, -HIPW, pelvY, 0, aLl,kG+0.06*fr-0.06*giu2, -0.11);
}

/* DELUSIONE di chi subisce: ANTICIPO le mani che salgono mentre lo
   sguardo va al cielo ("perche'?"), poi il crollo in avanti — le
   braccia mollano DOPO il busto e la testa arriva ULTIMA (SEGUITO),
   le gambe cedono con l'affondo (PESO) — la sospensione a capo
   chino, il rientro lento. */
function poseDelusione(u){
  const mani=sm(u,0.08,0.22);              // le mani dietro la testa
  const arco=sm(u,0.10,0.26)*(1-sm(u,0.40,0.56));  // lo sguardo al cielo
  const piega=sm(u,0.44,0.62);             // il crollo in avanti
  const molla=sm(u,0.48,0.66);             // le braccia mollano (dopo il busto)
  const testa=sm(u,0.52,0.72);             // la testa arriva ultima
  const ri=sm(u,0.82,0.97);                // il rientro
  const dd=(u-0.55)/0.07, dip=Math.exp(-dd*dd);   // le gambe cedono
  const maniF=mani*(1-molla);
  const penz=molla-ri, testaF=testa-ri;
  const pelvY=0.92+0.02*arco-0.13*piega-0.05*dip+0.13*ri;
  const lean=0.06-0.32*arco+0.72*piega-0.72*ri+0.05*dip;
  corpo(pelvY,0,lean,0);
  /* il "perche'?" al cielo, e poi la testa che pende: due cenni, non due
     traslazioni del cranio (il collo si accorciava del 27%) */
  cenno(-0.32*arco+0.95*testaF);
  const sl=Math.sin(lean), cl=Math.cos(lean);
  const shY=pelvY+0.44*cl, shZ=0.44*sl;
  const aB=0.12+2.43*maniF-0.18*penz;
  const eB=0.18+2.00*maniF+0.04*penz;
  /* i GOMITI ESCONO. Con outB che CALAVA (0,05 -> -0,04) le mani alla
     testa portavano le braccia dentro il busto: una massa sola, e il
     gesto piu' riconoscibile del calcio spariva. Le mani in testa vere
     hanno i gomiti spalancati — 0,19 di scarto e' un'abduzione di 0,78
     rad, dentro la gabbia (tetto 1,05). */
  const outB=0.05+0.14*maniF;
  braccio(SHR,ELR,HAR,  SHW, shY, shZ, aB,eB, outB, 1);
  braccio(SHL,ELL,HAL, -SHW, shY, shZ, aB*1.03,eB, outB,-1);
  const kG=0.25+0.55*piega+0.40*dip-0.55*ri;
  gamba(HIPR,KNR,FTR,TOR,  HIPW, pelvY, 0,  0.26-0.10*piega+0.10*ri, kG,  0.22);
  gamba(HIPL,KNL,FTL,TOL, -HIPW, pelvY, 0, -0.16+0.05*piega-0.05*ri, kG+0.28, -0.23);
}

/* ESULTANZA AL CIELO — la posa della RIPRESA DEDICATA del gol, nata per
   la camera bassa (AZIONI.md, decisione 3). Le altre esultanze sono
   pensate per la pianta: l'aliante a braccia rigide, visto di tre quarti
   dal basso, leggeva come un corpo steso sull'erba. Questa e' un
   MANIFESTO: ANTICIPO il mezzo affondo di carica, poi le braccia salgono
   AL CIELO COI GOMITI PIEGATI a V mentre il petto va IN FUORI (il busto
   si inarca all'indietro, la faccia al cielo), l'overshoot smorzato
   della piantata (SEGUITO), e da ferma la posa RESPIRA — il petto sale e
   scende, le mani vibrano appena. Il giro non si chiude: freq 0,5 e la
   ripresa dura meno del giro, quindi u non torna mai a zero. */
function poseCielo(u){
  const ca=sm(u,0.02,0.10);                 // la carica: mezzo affondo
  const su=sm(u,0.08,0.24);                 // le braccia salgono, il petto si apre
  const p=u-0.24, osc=p>0?Math.sin(p*9.5)*Math.exp(-4.2*p):0;   // la piantata
  const resp=p>0?Math.sin(p*4.6):0;         // il respiro da fermo
  const pelvY=0.90-0.10*ca+0.03*su+0.012*resp*su;
  const lean=0.06+0.16*ca-0.36*su-0.035*osc-0.012*resp;  // petto in fuori: arco indietro
  corpo(pelvY,0,lean,0);
  cenno(-0.46*su);                                       // la faccia al cielo
  const sl=Math.sin(lean), cl=Math.cos(lean);
  const shY=pelvY+0.44*cl, shZ=0.44*sl;
  /* braccia: giu' in carica, poi su a V APERTA — gomiti piegati e fuori,
     mani sopra la testa, larghe; il respiro le fa vibrare appena */
  const aB=0.14-0.40*ca+(2.62+0.14*osc+0.03*resp)*su;
  const eB=0.30+0.45*ca+(0.36+0.06*osc-0.45*ca)*su;      // ~0.66 a regime
  const outB=0.05+0.21*su;
  braccio(SHR,ELR,HAR,  SHW, shY, shZ, aB,eB, outB, 1);
  braccio(SHL,ELL,HAL, -SHW, shY, shZ, aB*0.97,eB*1.04, outB,-1);
  /* gambe: piantate, quasi tese, una mezza avanti — un piedistallo,
     non un passo (strette: il corpo resta una figura, non una campana) */
  const kG=0.14+0.75*ca-0.06*su;
  gamba(HIPR,KNR,FTR,TOR,  HIPW, pelvY, 0,  0.16-0.05*su, kG+0.05,  0.11);
  gamba(HIPL,KNL,FTL,TOL, -HIPW, pelvY, 0, -0.10+0.03*su, kG,      -0.11);
}
